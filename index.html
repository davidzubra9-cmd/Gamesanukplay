<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0b55">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd21f'/%3E%3Cpath d='M24 16l26 16-26 16z' fill='%232a0b55'/%3E%3C/svg%3E">
<title>สนุกเพลย์ — เล่นเกมออนไลน์ฟรี พร้อมเกมประเพณีไทย</title>
<meta name="description" content="เว็บเกมออนไลน์ฟรี ธีมม่วงเหลือง พร้อมหมวดเกมประเพณีไทย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* =========================================================
   สนุกเพลย์ — ธีมม่วง × เหลือง
   แก้สีหลักได้ที่ตัวแปรใน :root ด้านล่าง
   ========================================================= */
:root{color-scheme:dark;
  --bg:#150431;
  --bg-2:#1e0746;
  --panel:#2a0d5c;
  --panel-2:#35146f;
  --line:rgba(255,255,255,.1);
  --purple:#7c3aed;
  --purple-2:#9d5cff;
  --violet-soft:#c4b5fd;
  --yellow:#ffd21f;
  --yellow-2:#ffae00;
  --ink:#2a0b55;
  --text:#f7f2ff;
  --muted:#b9a6e6;
  --radius:18px;
  --shadow:0 10px 30px rgba(10,0,30,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
  background-image:
    radial-gradient(900px 500px at 85% -10%,rgba(124,58,237,.45),transparent 60%),
    radial-gradient(700px 500px at -10% 30%,rgba(255,210,31,.07),transparent 60%);
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
ul{list-style:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(21,4,49,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:3px solid var(--yellow)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.45rem;white-space:nowrap}
.logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--yellow),var(--yellow-2));display:grid;place-items:center;box-shadow:0 4px 0 #b37a00,0 8px 18px rgba(255,210,31,.3);transform:rotate(-6deg);transition:transform .2s}
.logo:hover .logo-mark{transform:rotate(6deg) scale(1.06)}
.logo-mark svg{width:20px;height:20px;fill:var(--ink);margin-left:2px}
.logo b{color:var(--yellow)}
.nav-links{display:flex;gap:6px;margin-left:8px}
.nav-links a{padding:8px 14px;border-radius:999px;font-weight:600;color:var(--violet-soft);transition:.15s}
.nav-links a:hover{background:var(--panel)}
.nav-links a.hot{color:var(--ink);background:linear-gradient(135deg,var(--yellow),var(--yellow-2))}
.search{flex:1;max-width:480px;position:relative;margin-left:auto}
.search input{width:100%;padding:10px 16px 10px 42px;border-radius:999px;border:2px solid transparent;background:var(--panel);color:var(--text);font:inherit;outline:none;transition:.15s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--yellow);background:var(--panel-2)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.85;pointer-events:none}

/* ---------- Category bar ---------- */
.catbar{background:var(--bg-2);border-bottom:1px solid var(--line)}
.catbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.catbar-in::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--panel);border:2px solid transparent;font-weight:600;color:var(--violet-soft);display:inline-flex;gap:7px;align-items:center;transition:.15s;white-space:nowrap}
.chip:hover{border-color:rgba(255,210,31,.55);color:#fff}
.chip.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.chip.special{background:linear-gradient(135deg,#4c1d95,#6d28d9);border-color:var(--yellow);color:var(--yellow);animation:pulse 2.6s infinite}
.chip.special.on{background:linear-gradient(135deg,var(--yellow),var(--yellow-2));color:var(--ink);animation:none}
.chip .n{font-size:.75rem;opacity:.75;font-weight:500}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,210,31,.55)}70%{box-shadow:0 0 0 10px rgba(255,210,31,0)}100%{box-shadow:0 0 0 0 rgba(255,210,31,0)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;font-weight:700;background:linear-gradient(135deg,var(--yellow),var(--yellow-2));color:var(--ink);box-shadow:0 4px 0 #b37a00,0 10px 22px rgba(255,174,0,.28);transition:.12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b37a00}
.btn.ghost{background:var(--panel-2);color:#fff;box-shadow:0 4px 0 #1a0640}
.btn.big{padding:14px 34px;font-size:1.1rem}

/* ---------- Hero ---------- */
main{padding-bottom:40px;min-height:60vh}
.hero{position:relative;overflow:hidden;border-radius:26px;margin:20px 0 10px;padding:34px;background:linear-gradient(120deg,#3b0f86 0%,#6d28d9 55%,#a855f7 100%);border:2px solid rgba(255,210,31,.6);box-shadow:var(--shadow);display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#fff6b8 0%,#ffd21f 45%,rgba(255,210,31,0) 70%);opacity:.5}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.6px,transparent 1.7px);background-size:22px 22px;opacity:.55;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .kicker{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px;margin-bottom:12px}
.hero h1{font-size:clamp(1.7rem,4.2vw,2.8rem);line-height:1.18;font-weight:800}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{color:#eadfff;margin:12px 0 20px;max-width:46ch}
.hero-games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero-games .card:nth-child(2){transform:translateY(14px)}
.hero-games .card:nth-child(2):hover{transform:translateY(10px) scale(1.02)}
.hero-games .card-meta{display:none}
.hero-games .card-title{font-size:.88rem}

/* ---------- Sections & grid ---------- */
.sec{margin:30px 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-head h2{font-size:1.3rem;font-weight:700;display:flex;gap:10px;align-items:center}
.sec-head h2::before{content:"";width:6px;height:24px;border-radius:4px;background:var(--yellow)}
.sec-head .sub{color:var(--muted);font-size:.92rem;font-weight:400}
.more{color:var(--yellow);font-weight:600;font-size:.95rem;white-space:nowrap}
.more:hover{text-decoration:underline}
.sec.special{padding:22px;border-radius:26px;background:linear-gradient(160deg,rgba(124,58,237,.38),rgba(53,20,111,.45));border:2px dashed rgba(255,210,31,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}
.cat-banner{margin:22px 0 4px;padding:22px 24px;border-radius:22px;background:linear-gradient(120deg,#4c1d95,#7c3aed);border:2px solid rgba(255,210,31,.55);display:flex;gap:16px;align-items:center}
.cat-banner .big{font-size:3rem;line-height:1}
.cat-banner h1{font-size:1.6rem;font-weight:800}
.cat-banner p{color:#e6d9ff}

/* ---------- Card ---------- */
.card{display:flex;flex-direction:column;border-radius:18px;background:var(--panel);overflow:hidden;border:2px solid transparent;transition:transform .18s,border-color .18s,box-shadow .18s;position:relative}
.card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--yellow);box-shadow:0 12px 28px rgba(255,210,31,.2),var(--shadow)}
.thumb{position:relative;aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden}
.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.3),transparent 45%),radial-gradient(circle at 85% 95%,rgba(0,0,0,.3),transparent 55%)}
.thumb::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1.5px,transparent 1.6px);background-size:18px 18px;opacity:.5}
.thumb .em{position:relative;z-index:1;font-size:3.4rem;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));transition:transform .25s}
.card:hover .em{transform:scale(1.15) rotate(-6deg)}
.badge{position:absolute;top:8px;left:8px;z-index:2;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--yellow);color:var(--ink)}
.badge.thai{background:#fff;color:#6d28d9}
.play-hint{position:absolute;right:8px;bottom:8px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.18s}
.play-hint svg{width:14px;height:14px;fill:var(--ink);margin-left:2px}
.card:hover .play-hint{opacity:1;transform:none}
.card-body{padding:10px 12px 12px}
.card-title{font-weight:600;font-size:.97rem;line-height:1.3}
.card-meta{display:flex;justify-content:space-between;gap:6px;font-size:.78rem;color:var(--muted);margin-top:4px}
.card-meta .best{color:var(--yellow)}

/* ---------- Play page ---------- */
.crumbs{margin:18px 0 0;color:var(--muted);font-size:.9rem}
.crumbs a{color:var(--violet-soft)}
.crumbs a:hover{color:var(--yellow)}
.play-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;margin-top:14px;align-items:start}
.play-main{min-width:0}
.stage-wrap{background:linear-gradient(180deg,var(--panel),#240a52);border:2px solid rgba(255,210,31,.6);border-radius:22px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px}
.stage-box{position:relative;background:#0e0222;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px rgba(124,58,237,.7);max-width:100%}
.stage-root{position:absolute;inset:0;width:100%;height:100%}
.stage-root canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.stage-root.dom{touch-action:none;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7em;padding:1.2em;text-align:center;background:radial-gradient(circle at 50% 25%,rgba(109,40,217,.93),rgba(21,4,49,.97));z-index:20;overflow:auto}
.overlay.hide{display:none}
.ov-icon{font-size:3.4em;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.overlay h2{font-size:1.7em;font-weight:800;line-height:1.2}
.overlay h2 em{font-style:normal;color:var(--yellow)}
.ov-how{display:flex;flex-direction:column;gap:.35em;font-size:.95em;color:#eadfff;max-width:30em;text-align:left}
.ov-how li::before{content:"✦ ";color:var(--yellow)}
.ov-ctrl{font-size:.85em;color:var(--violet-soft)}
.ov-score{font-size:3em;font-weight:800;color:var(--yellow);line-height:1}
.ov-sub{color:#eadfff}
.ov-new{background:var(--yellow);color:var(--ink);font-weight:800;padding:.2em 1em;border-radius:999px;animation:bob 1s ease-in-out infinite}
.ov-btns{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center;margin-top:.3em}
.ov-btns .btn{font-size:1em}
.stagebar{width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud span{background:var(--bg);padding:6px 14px;border-radius:999px;font-size:.88rem;color:var(--muted)}
.hud b{color:var(--yellow);font-size:1.05rem;margin-left:4px}
.btns{display:flex;gap:8px}
.ibtn{width:42px;height:42px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-size:1.15rem;transition:.12s}
.ibtn:hover{background:var(--purple)}
.stage-wrap:fullscreen{border-radius:0;justify-content:center;background:#0e0222;border:0}
.stage-wrap:-webkit-full-screen{border-radius:0;justify-content:center;background:#0e0222;border:0}

.info{margin-top:18px;background:var(--panel);border-radius:22px;padding:22px 24px}
.info h1{font-size:1.6rem;font-weight:800;line-height:1.25}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.tag{font-size:.8rem;padding:3px 12px;border-radius:999px;background:var(--panel-2);color:var(--violet-soft)}
.tag.y{background:var(--yellow);color:var(--ink);font-weight:700}
.info h3{margin:16px 0 6px;font-size:1.05rem;color:var(--yellow)}
.info p{color:#e6dbff}
.info ul li{padding-left:1.2em;position:relative;color:#e6dbff;margin:3px 0}
.info ul li::before{content:"✦";position:absolute;left:0;color:var(--yellow);font-size:.8em;top:.2em}
.fact{margin-top:16px;padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,rgba(255,210,31,.16),rgba(255,210,31,.05));border:1px solid rgba(255,210,31,.45)}
.fact b{color:var(--yellow)}
.side h3{font-size:1.1rem;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.side h3::before{content:"";width:6px;height:20px;border-radius:4px;background:var(--yellow)}
.mini{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;background:var(--panel);border:2px solid transparent;margin-bottom:10px;transition:.15s}
.mini:hover{border-color:var(--yellow);transform:translateX(3px)}
.mini .thumb{width:76px;flex:0 0 76px;aspect-ratio:1;border-radius:12px}
.mini .thumb .em{font-size:2.1rem}
.mini b{display:block;font-weight:600;line-height:1.3}
.mini small{color:var(--muted)}

/* ---------- Footer ---------- */
footer{border-top:3px solid var(--yellow);background:#0f0224;margin-top:30px}
.foot-in{max-width:1280px;margin:0 auto;padding:26px 16px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.foot-in b{color:var(--yellow)}
.foot-links{display:flex;gap:16px;flex-wrap:wrap}
.foot-links a:hover{color:var(--yellow)}

/* =========================================================
   DOM games
   ========================================================= */
/* --- จับคู่ไทยแท้ --- */
.mem{position:absolute;inset:0;display:flex;flex-direction:column;padding:.9em;gap:.7em;background:radial-gradient(circle at 50% 0,#4c1d95,#1e0746);color:#fff}
.mem-top{display:flex;justify-content:space-between;gap:.5em;font-weight:600;font-size:.95em}
.mem-top span{background:rgba(0,0,0,.32);padding:.25em .8em;border-radius:999px;white-space:nowrap}
.mem-top b{color:var(--yellow)}
.mem-grid{flex:1;display:grid;gap:.55em;min-height:0}
.mem-card{perspective:700px;position:relative;cursor:pointer;min-height:0;-webkit-tap-highlight-color:transparent}
.mem-in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mem-card.flip .mem-in,.mem-card.done .mem-in{transform:rotateY(180deg)}
.mem-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:.8em;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.mem-front{background:repeating-linear-gradient(45deg,#7c3aed 0 .5em,#6d28d9 .5em 1em);border:.14em solid var(--yellow);font-size:1.7em;color:var(--yellow)}
.mem-back{transform:rotateY(180deg);background:linear-gradient(160deg,#fff7d1,#ffe27a);color:#3b0a7a;border:.14em solid #fff}
.mem-back .e{font-size:2.1em;line-height:1.1}
.mem-back .t{font-size:.7em;font-weight:700;margin-top:.1em}
.mem-card.done .mem-back{background:linear-gradient(160deg,#ffe27a,#ffd21f);box-shadow:0 0 .9em rgba(255,210,31,.85)}
.mem-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);background:var(--yellow);color:var(--ink);font-weight:800;font-size:1.5em;padding:.5em 1.2em;border-radius:1em;opacity:0;pointer-events:none;transition:.25s;z-index:5;white-space:nowrap;box-shadow:0 .4em 1.5em rgba(0,0,0,.5)}
.mem-msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* --- 2048 --- */
.t48{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:.9em;padding:1em;background:radial-gradient(circle at 50% 0,#4c1d95,#1e0746);color:#fff}
.t48-top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.6em}
.t48-top h2{font-size:2.3em;color:var(--yellow);font-weight:800;line-height:1}
.t48-box{background:rgba(0,0,0,.35);border-radius:.8em;padding:.3em 1em;text-align:center;font-size:.8em;color:var(--violet-soft)}
.t48-box b{display:block;color:#fff;font-size:1.5em;line-height:1.2}
.t48-hint{font-size:.85em;color:var(--violet-soft);text-align:center}
.t48-board{position:relative;width:min(100%,27em);aspect-ratio:1;background:#2a0d5c;border-radius:.9em;box-shadow:inset 0 0 0 .2em rgba(255,210,31,.4)}
.t48-cells,.t48-tiles{position:absolute;inset:.55em}
.t48-cell{position:absolute;width:23.5%;height:23.5%;border-radius:.5em;background:rgba(255,255,255,.07)}
.t48-tile{position:absolute;width:23.5%;height:23.5%;display:grid;place-items:center;font-weight:800;border-radius:.5em;transition:left .12s ease,top .12s ease;font-size:2em;box-shadow:0 .15em 0 rgba(0,0,0,.25)}
.t48-tile.d3{font-size:1.65em}
.t48-tile.d4{font-size:1.3em}
.t48-tile.new{animation:tpop .18s ease}
.t48-tile.merge{animation:tmerge .2s ease}
@keyframes tpop{from{transform:scale(.3);opacity:.2}to{transform:scale(1);opacity:1}}
@keyframes tmerge{50%{transform:scale(1.18)}}
.t48-toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--yellow);color:var(--ink);font-weight:800;padding:.5em 1.2em;border-radius:1em;z-index:5;font-size:1.3em;box-shadow:0 .4em 1.5em rgba(0,0,0,.5);animation:tpop .25s ease}

/* --- OX --- */
.ox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;padding:1em;background:radial-gradient(circle at 50% 0,#4c1d95,#1e0746);color:#fff}
.ox-top{display:flex;gap:.6em;font-weight:600;flex-wrap:wrap;justify-content:center}
.ox-top span{background:rgba(0,0,0,.32);padding:.25em .9em;border-radius:999px}
.ox-top b{color:var(--yellow)}
.ox-status{font-size:1.25em;font-weight:700;min-height:1.6em;text-align:center}
.ox-board{display:grid;grid-template-columns:repeat(3,1fr);gap:.55em;width:min(100%,20em);aspect-ratio:1}
.ox-cell{border-radius:.8em;background:var(--panel);font-size:3.4em;font-weight:800;display:grid;place-items:center;line-height:1;border:.07em solid rgba(255,255,255,.1);transition:.12s}
.ox-cell:hover:not(:disabled){background:var(--panel-2);transform:scale(1.03)}
.ox-cell.x{color:var(--yellow)}
.ox-cell.o{color:#c4a1ff}
.ox-cell.win{background:linear-gradient(135deg,var(--yellow),var(--yellow-2));color:var(--ink)}
.ox-pick{display:flex;gap:.7em}
.ox-pick .btn{font-size:1em}

@media (max-width:1000px){
  .play-layout{grid-template-columns:1fr}
  .side{order:2}
}
@media (max-width:820px){
  .nav-links{display:none}
  .hero{grid-template-columns:1fr;padding:24px 20px}
  .hero-games{max-width:520px}
}
@media (max-width:560px){
  .topbar-in{gap:10px;padding:8px 12px}
  .logo{font-size:1.2rem}
  .logo-mark{width:34px;height:34px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .sec-head h2 .sub{display:none}
  .sec-head h2{font-size:1.15rem}
  .sec.special{padding:14px;border-radius:20px}
  .info{padding:18px}
  .wrap{padding:0 12px}

    g.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    g.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);

    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();

  function audio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} }

    var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.03);
  };
  SP.noise = function (dur, vol) {
    if (muted) return;
    var a = audio(); if (!a) return;
    dur = dur || 0.15; vol = vol == null ? 0.1 : vol;
    var n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);

    coin:  function () { SP.tone(880, 0.07, 'square', 0.06); setTimeout(function () { SP.tone(1320, 0.1, 'square', 0.06); }, 70); },
    hit:   function () { SP.tone(200, 0.2, 'sawtooth', 0.1, 60); },
    shoot: function () { SP.tone(900, 0.06, 'square', 0.03, 400); },
    boom:  function () { SP.noise(0.25, 0.12); SP.tone(120, 0.25, 'sawtooth', 0.08, 40); },
    jump:  function () { SP.tone(300, 0.14, 'square', 0.06, 700); },
    splash: function () { SP.noise(0.14, 0.09); },
    flip:  function () { SP.tone(600, 0.05, 'triangle', 0.08); },
    win:   function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { SP.tone(f, 0.16, 'triangle', 0.1); }, i * 110); }); },
    lose:  function () { [420, 330, 250, 170].forEach(function (f, i) { setTimeout(function () { SP.tone(f, 0.18, 'sawtooth', 0.07); }, i * 130); }); },
    /* เสียงระนาด: ไม้กระทบไม้ */
    ranad: function (f) {

      SP.tone(f * 2, 0.22, 'sine', 0.07);
      SP.tone(f * 3.01, 0.08, 'sine', 0.03);

/* ทุบอิฐมหาสนุก — เด้งลูกบอลทุบอิฐ เก็บแคปซูลช่วยเหลือ */
SP.register('brick-breaker', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;

  const PAD = { x: W / 2, y: H - 50, w: 90, h: 14, tx: W / 2 };
  const COLS = 8, BW = (W - 40) / COLS, BH = 24;
  const PAL = ['#ffd21f', '#ff9f43', '#c084fc', '#a855f7', '#8b5cf6', '#7c3aed'];
  let balls = [], bricks = [], caps = [], parts = [];
  let lives = 3, score = 0, level = 0, t = 0, wideT = 0, launched = false, spd = 330;
  const keys = {};

  function build() {
    bricks = [];
    const rows = Math.min(8, 4 + level);
    for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
      if (level >= 2 && (r + c) % 5 === 4) continue;
      bricks.push({ x: 20 + c * BW, y: 70 + r * (BH + 4), hp: level >= 1 && r < Math.min(level + 1, 3) ? 2 : 1, col: PAL[r % PAL.length] });
    }
  }
  function resetBall() {
    launched = false; spd = 330 + level * 25;
    balls = [{ x: PAD.x, y: PAD.y - 16, vx: 0, vy: 0, r: 8 }];
  }
  function burst(x, y, c, n) {
    for (let i = 0; i < n; i++) { const a = R(0, 6.28), v = R(40, 170); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.25, 0.6), c }); }
  }
  function launch() {
    if (launched) return;
    launched = true;
    const a = -Math.PI / 2 + R(-0.35, 0.35);
    balls[0].vx = Math.cos(a) * spd; balls[0].vy = Math.sin(a) * spd;
    SP.sfx.pop();
  }

  ctx.on(ctx.canvas, 'pointermove', e => { PAD.tx = ctx.pos(e).x; });
  ctx.on(ctx.canvas, 'pointerdown', e => { PAD.tx = ctx.pos(e).x; launch(); });
  ctx.on(window, 'keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'ArrowUp') launch(); });
  ctx.on(window, 'keyup', e => { keys[e.key] = false; });

  build(); resetBall();

  function update(dt) {
    t += dt; ctx.setScore(score);
    if (wideT > 0) { wideT -= dt; PAD.w += (150 - PAD.w) * Math.min(1, dt * 8); } else PAD.w += (90 - PAD.w) * Math.min(1, dt * 8);
    const L = keys.ArrowLeft || keys.a || keys.A, Rr = keys.ArrowRight || keys.d || keys.D;
    if (L || Rr) PAD.tx += ((Rr ? 1 : 0) - (L ? 1 : 0)) * 620 * dt;
    PAD.tx = clamp(PAD.tx, PAD.w / 2 + 6, W - PAD.w / 2 - 6);
    PAD.x += (PAD.tx - PAD.x) * Math.min(1, dt * 16);

    for (const b of balls) {
      if (!launched) { b.x = PAD.x; b.y = PAD.y - 16; continue; }
      // แบ่งเป็นก้าวย่อยกันทะลุ
      const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 6);
      for (let s = 0; s < steps; s++) {
        b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
        if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
        // แผ่นรับ
        if (b.vy > 0 && b.y + b.r >= PAD.y && b.y + b.r <= PAD.y + PAD.h + 8 && Math.abs(b.x - PAD.x) <= PAD.w / 2 + b.r) {
          const off = clamp((b.x - PAD.x) / (PAD.w / 2), -1, 1);
          const a = -Math.PI / 2 + off * 1.05;
          const sp = Math.min(560, Math.hypot(b.vx, b.vy) * 1.01);
          b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.y = PAD.y - b.r; SP.sfx.click();
        }
        // อิฐ
        for (const k of bricks) {
          if (k.hp <= 0) continue;
          const nx = clamp(b.x, k.x, k.x + BW - 4), ny = clamp(b.y, k.y, k.y + BH);
          const dx = b.x - nx, dy = b.y - ny;
          if (dx * dx + dy * dy <= b.r * b.r) {
            if (Math.abs(dx) > Math.abs(dy)) b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
            else b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
            k.hp--;
            if (k.hp <= 0) {
              score += 10; SP.sfx.pop(); burst(k.x + BW / 2, k.y + BH / 2, k.col, 8);
              if (Math.random() < 0.12) caps.push({ k: Math.random() < 0.7 ? 'w' : 'l', x: k.x + BW / 2, y: k.y });
            } else { SP.sfx.click(); score += 2; }
            break;
          }
        }
      }
    }
    for (let i = balls.length - 1; i >= 0; i--) if (balls[i].y > H + 20) balls.splice(i, 1);
    if (launched && !balls.length) {
      lives--; SP.sfx.hit();
      if (lives <= 0) { ctx.gameOver(score, 'ลูกบอลหลุดหมดแล้ว'); return; }
      resetBall();
    }
    for (const c of caps) {
      c.y += 150 * dt;
      if (c.y > PAD.y - 6 && c.y < PAD.y + 20 && Math.abs(c.x - PAD.x) < PAD.w / 2 + 12) {
        c.dead = true; SP.sfx.coin();
        if (c.k === 'w') wideT = 10; else if (lives < 5) lives++;
      }
    }
    for (let i = caps.length - 1; i >= 0; i--) if (caps[i].dead || caps[i].y > H + 20) caps.splice(i, 1);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);

    if (launched && bricks.every(k => k.hp <= 0)) {
      level++; score += 100; SP.sfx.win(); build(); resetBall(); caps = [];
    }
  }

  function draw() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a0638'); bg.addColorStop(1, '#3d1a85');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 20; i++) g.fillRect((i * 97) % W, (i * 53 + t * 8) % H, 2, 2);

    for (const k of bricks) {
      if (k.hp <= 0) continue;
      g.fillStyle = k.col; SP.rr(g, k.x, k.y, BW - 4, BH, 6); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.28)'; SP.rr(g, k.x + 3, k.y + 3, BW - 10, 6, 3); g.fill();
      if (k.hp > 1) { g.strokeStyle = '#fff'; g.lineWidth = 2.5; SP.rr(g, k.x + 1, k.y + 1, BW - 6, BH - 2, 6); g.stroke(); }
    }
    for (const c of caps) {
      g.fillStyle = c.k === 'w' ? '#ffd21f' : '#ff4d8d'; SP.rr(g, c.x - 16, c.y - 10, 32, 20, 10); g.fill();
      g.fillStyle = '#2a0b55'; g.font = '800 15px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText(c.k === 'w' ? 'W' : '+', c.x, c.y + 5);
    }
    // แผ่นรับ
    const pg = g.createLinearGradient(0, PAD.y, 0, PAD.y + PAD.h);
    pg.addColorStop(0, '#ffe66d'); pg.addColorStop(1, '#ffae00');
    g.fillStyle = pg; SP.rr(g, PAD.x - PAD.w / 2, PAD.y, PAD.w, PAD.h, 7); g.fill();
    g.fillStyle = '#7c3aed'; g.fillRect(PAD.x - 8, PAD.y + 3, 16, 8);
    for (const b of balls) {
      SP.glow(g, b.x, b.y, 22, 'rgba(255,255,255,0.7)', 0.7);
      g.fillStyle = '#fff'; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 6.3); g.fill();
    }
    for (const p of parts) { g.globalAlpha = clamp(p.life * 3, 0, 1); g.fillStyle = p.c; g.fillRect(p.x - 2, p.y - 2, 4, 4); }
    g.globalAlpha = 1;
    for (let i = 0; i < lives; i++) { SP.heartPath(g, 24 + i * 28, 12, 20); g.fillStyle = '#ff4d8d'; g.fill(); }
    g.fillStyle = '#ffd21f'; g.font = '700 16px Prompt, sans-serif'; g.textAlign = 'right';
    g.fillText('ด่าน ' + (level + 1), W - 16, 28);
    if (!launched) {
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 150, H / 2 + 40, 300, 44, 14); g.fill();
      g.fillStyle = '#fff'; g.font = '600 17px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('แตะ / คลิก / Space เพื่อปล่อยบอล', W / 2, H / 2 + 68);
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* ว่าวจุฬาล่องลม — กดค้างให้ลมหนุนว่าวขึ้น ปล่อยให้ร่อนลง เก็บดาว หลบนก เมฆฝน และว่าวปักเป้า */
SP.register('kite-sky', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;
  const GROUND = H - 70;

  const K = { x: 210, y: 220, vy: 0, tilt: 0 };
  let lives = 3, stars = 0, dist = 0, speed = 230, t = 0, inv = 0, hold = false, spawnT = 1, starT = 1.2;
  const obs = [], pick = [], sparks = [], texts = [], clouds = [], palms = [];
  const tail = [];
  for (let i = 0; i < 8; i++) tail.push({ x: K.x, y: K.y });
  for (let i = 0; i < 6; i++) clouds.push({ x: R(0, W), y: R(30, 200), s: R(0.6, 1.4), v: R(0.15, 0.4) });
  for (let i = 0; i < 4; i++) palms.push({ x: i * 230 + R(0, 100), h: R(70, 110) });

  ctx.on(ctx.canvas, 'pointerdown', () => { hold = true; });
  ctx.on(window, 'pointerup', () => { hold = false; });
  ctx.on(window, 'pointercancel', () => { hold = false; });
  const keyH = {};
  ctx.on(window, 'keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keyH.v = true; });
  ctx.on(window, 'keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keyH.v = false; });

  function say(x, y, s, c) { texts.push({ x, y, s, c, life: 0.9 }); }
  function burst(x, y, c, n) {
    for (let i = 0; i < n; i++) {
      const a = R(0, 6.28), v = R(50, 170);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.3, 0.7), c });
    }
  }

  function spawnObs() {
    const r = Math.random();
    if (r < 0.45) obs.push({ k: 'bird', x: W + 40, y: R(70, GROUND - 90), v: speed + R(40, 120), ph: R(0, 6), r: 20 });
    else if (r < 0.75) obs.push({ k: 'rival', x: W + 50, y: R(90, GROUND - 120), v: speed * 0.8, ph: R(0, 6), base: 0, r: 27 });
    else obs.push({ k: 'storm', x: W + 80, y: R(60, GROUND - 160), v: speed * 0.85, r: 48, ph: R(0, 6) });
    if (obs[obs.length - 1].k === 'rival') obs[obs.length - 1].base = obs[obs.length - 1].y;
  }

  function update(dt) {
    t += dt;
    speed = 230 + Math.min(200, t * 3.2);
    dist += speed * dt;

    if (inv > 0) inv -= dt;

    const up = hold || keyH.v;
    K.vy += (up ? -1500 : 950) * dt;
    K.vy = clamp(K.vy, -340, 400);
    K.y += K.vy * dt;
    K.tilt += (clamp(K.vy / 500, -0.5, 0.5) - K.tilt) * Math.min(1, dt * 8);
    if (K.y < 30) { K.y = 30; K.vy = 0; }
    if (K.y > GROUND - 20) { SP.sfx.hit(); ctx.gameOver(Math.floor(dist / 40) + stars * 5, 'ว่าวตกพื้นแล้ว!'); return; }

      }

    for (const s of pick) {

      }

    for (const c of clouds) { c.x -= speed * c.v * dt; if (c.x < -150) { c.x = W + 100; c.y = R(30, 200); } }
    for (const p of palms) { p.x -= speed * 0.6 * dt; if (p.x < -60) { p.x = W + R(20, 200); p.h = R(70, 110); } }
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
    for (const x of texts) { x.y -= 36 * dt; x.life -= dt; }
    for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);

  function drawChula(x, y, tilt, scale) {

  }

  function drawPakpao(o) {

    g.fillStyle = '#ef4444'; g.beginPath(); g.moveTo(0, -30); g.lineTo(22, 0); g.lineTo(0, 30); g.lineTo(-22, 0); g.closePath(); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, -30); g.lineTo(22, 0); g.lineTo(0, 0); g.closePath(); g.fill();

    g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 30);

  function drawBird(o) {

    g.beginPath(); g.moveTo(-4, -2); g.quadraticCurveTo(4, -26 * f - 4, 14, -4); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(16, 0); g.lineTo(28, -4); g.lineTo(28, 4); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(-15, -4, 1.8, 0, 6.3); g.fill();

  function drawStorm(o) {
    g.save(); g.translate(o.x, o.y);
    g.fillStyle = '#3b3358';
    [[-30, 8, 28], [0, -6, 36], [32, 8, 28], [0, 14, 30]].forEach(c => { g.beginPath(); g.arc(c[0], c[1], c[2], 0, 6.3); g.fill(); });
    g.fillStyle = '#4b4270'; g.beginPath(); g.arc(-6, -12, 24, 0, 6.3); g.fill();
    if (Math.sin(t * 5 + o.ph) > 0.6) {
      g.strokeStyle = '#ffe066'; g.lineWidth = 4; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(4, 24); g.lineTo(-6, 42); g.lineTo(6, 42); g.lineTo(-4, 62); g.stroke();
    }
    g.restore();
  }

  function draw() {
    const sky = g.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#4c1d95'); sky.addColorStop(0.5, '#b4529a'); sky.addColorStop(1, '#ffc15a');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    SP.glow(g, 620, GROUND - 40, 230, 'rgba(255,235,150,0.8)', 0.9);
    for (const c of clouds) {
      g.fillStyle = 'rgba(255,255,255,0.28)';
      g.beginPath(); g.ellipse(c.x, c.y, 60 * c.s, 16 * c.s, 0, 0, 6.3); g.ellipse(c.x + 30 * c.s, c.y - 10 * c.s, 40 * c.s, 14 * c.s, 0, 0, 6.3); g.fill();
    }
    // ภูเขาไกล
    g.fillStyle = '#5b2a9e'; g.beginPath(); g.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 80) g.lineTo(x, GROUND - 50 - 30 * Math.sin(x * 0.011 + 1));
    g.lineTo(W, GROUND); g.fill();
    // ต้นตาล/มะพร้าว
    for (const p of palms) {
      g.strokeStyle = '#2b0d57'; g.lineWidth = 6; g.beginPath(); g.moveTo(p.x, GROUND + 8); g.quadraticCurveTo(p.x + 8, GROUND - p.h / 2, p.x + 2, GROUND - p.h); g.stroke();
      g.fillStyle = '#2b0d57';
      for (let i = 0; i < 6; i++) {
        g.save(); g.translate(p.x + 2, GROUND - p.h); g.rotate(-Math.PI / 2 + (i - 2.5) * 0.55 + Math.sin(t + i) * 0.04);
        g.beginPath(); g.ellipse(24, 0, 26, 5, 0, 0, 6.3); g.fill(); g.restore();
      }
    }
    // ทุ่งนา
    const fl = g.createLinearGradient(0, GROUND, 0, H);
    fl.addColorStop(0, '#d9a514'); fl.addColorStop(1, '#8a5c06');
    g.fillStyle = fl; g.fillRect(0, GROUND, W, H - GROUND);
    g.strokeStyle = 'rgba(255,235,140,0.5)'; g.lineWidth = 2;
    for (let i = 0; i < 9; i++) {
      const x = ((i * 110 - dist * 0.9) % (W + 110) + W + 110) % (W + 110) - 40;
      g.beginPath(); g.moveTo(x, GROUND + 4); g.lineTo(x - 70, H); g.stroke();
    }
    // เด็กชักว่าว
    g.fillStyle = '#ffd21f'; g.beginPath(); g.arc(60, GROUND - 6, 11, 0, 6.3); g.fill();
    g.fillStyle = '#ec4899'; SP.rr(g, 50, GROUND + 4, 20, 26, 6); g.fill();

    for (const s of pick) {
      SP.glow(g, s.x, s.y, 30, 'rgba(255,220,80,0.8)', 0.8);
      SP.starPath(g, s.x, s.y, 14, 6, 5, t * 1.5 + s.ph); g.fillStyle = '#ffd21f'; g.fill();
      g.strokeStyle = '#fff3a8'; g.lineWidth = 1.5; g.stroke();
    }
    for (const o of obs) {
      if (o.k === 'bird') drawBird(o); else if (o.k === 'rival') drawPakpao(o); else drawStorm(o);
    }
    // สายป่าน
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(60, GROUND - 14);
    g.quadraticCurveTo((60 + K.x) / 2, (GROUND + K.y) / 2 + 40, K.x, K.y + 8); g.stroke();
    // หาง
    g.strokeStyle = '#ffd21f'; g.lineWidth = 3; g.beginPath(); g.moveTo(tail[0].x, tail[0].y);
    for (let i = 1; i < tail.length; i++) g.lineTo(tail[i].x, tail[i].y);
    g.stroke();
    tail.forEach((p, i) => { if (i % 2) { g.fillStyle = '#ec4899'; g.beginPath(); g.arc(p.x, p.y, 4, 0, 6.3); g.fill(); } });
    if (!(inv > 0 && Math.floor(t * 12) % 2)) drawChula(K.x, K.y, K.tilt, 1);

    for (const s of sparks) { g.globalAlpha = clamp(s.life * 3, 0, 1); g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, 3, 0, 6.3); g.fill(); }
    g.globalAlpha = 1;
    g.font = '800 20px Prompt, sans-serif'; g.textAlign = 'center';
    for (const x of texts) {
      g.globalAlpha = clamp(x.life * 1.5, 0, 1);
      g.lineWidth = 4; g.strokeStyle = 'rgba(20,4,45,0.8)'; g.strokeText(x.s, x.x, x.y);
      g.fillStyle = x.c; g.fillText(x.s, x.x, x.y);
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      SP.heartPath(g, 26 + i * 30, 14, 22);
      g.fillStyle = i < lives ? '#ff4d8d' : 'rgba(255,255,255,0.2)'; g.fill();
    }
    g.fillStyle = '#ffd21f'; g.font = '700 16px Prompt, sans-serif'; g.textAlign = 'right';
    g.fillText('⭐ ' + stars, W - 14, 30);
    if (t < 4) {
      g.globalAlpha = clamp(4 - t, 0, 1);
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 200, 120, 400, 46, 14); g.fill();
      g.fillStyle = '#fff'; g.font = '600 18px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('กดค้างให้ว่าวขึ้น ปล่อยให้ว่าวร่อนลง', W / 2, 150);
      g.globalAlpha = 1;
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* ลอยกระทงล่องธารา — บังคับกระทงล่องน้ำยามค่ำคืน เก็บประทีป/ดอกบัว หลบหินและท่อนซุง */
SP.register('loy-krathong', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;

  const P = { x: W / 2, y: H - 140, tx: W / 2 };
  let lives = 3, pts = 0, dist = 0, speed = 170, t = 0, inv = 0, shake = 0, spawnT = 0.6;
  const items = [], sparks = [], ripples = [], glints = [], lanterns = [], texts = [];
  const keys = {};

  for (let i = 0; i < 28; i++) ripples.push({ x: R(20, W - 20), y: R(0, H), r: R(6, 16), a: R(0.08, 0.22) });
  for (let i = 0; i < 18; i++) glints.push({ y: R(0, H), w: R(8, 34), o: R(-60, 60) });
  for (let i = 0; i < 12; i++) lanterns.push({ x: R(0, W), y: R(0, H * 0.7), r: R(2, 5), v: R(8, 24), ph: R(0, 6) });

  ctx.on(window, 'keydown', e => { keys[e.key] = true; });
  ctx.on(window, 'keyup', e => { keys[e.key] = false; });
  ctx.on(ctx.canvas, 'pointermove', e => { P.tx = ctx.pos(e).x; });
  ctx.on(ctx.canvas, 'pointerdown', e => { P.tx = ctx.pos(e).x; });

  function spawn() {
    const r = Math.random(), x = R(55, W - 55);
    if (r < 0.34) items.push({ k: 'candle', x, y: -30, hw: 18, hh: 18 });
    else if (r < 0.56) items.push({ k: 'flower', x, y: -30, hw: 18, hh: 18, rot: R(0, 6) });
    else if (r < 0.82) { const s = R(20, 30); items.push({ k: 'rock', x, y: -40, hw: s * 0.85, hh: s * 0.8, s }); }
    else { const w = R(90, 150); items.push({ k: 'log', x, y: -40, hw: w / 2, hh: 13, w, a: R(-0.25, 0.25) }); }
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = R(0, 6.28), v = R(40, 170);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.4, 0.9), max: 0.9, c: color });
    }
  }
  function say(x, y, s, c) { texts.push({ x, y, s, c, life: 0.9 }); }

  function update(dt) {
    t += dt;
    speed = 170 + Math.min(230, dist / 45);
    dist += speed * dt;
    const total = Math.floor(pts + dist / 60);
    ctx.setScore(total);

    const L = keys.ArrowLeft || keys.a || keys.A, Rr = keys.ArrowRight || keys.d || keys.D;
    if (L || Rr) P.tx += ((Rr ? 1 : 0) - (L ? 1 : 0)) * 560 * dt;
    P.tx = clamp(P.tx, 44, W - 44);
    P.x += (P.tx - P.x) * Math.min(1, dt * 9);
    if (inv > 0) inv -= dt;
    if (shake > 0) shake -= dt;

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = R(0.5, 1.0) * (190 / speed) * 1.25; }

    for (const it of items) {
      it.y += speed * dt;
      if (it.dead) continue;
      if (Math.abs(it.x - P.x) < it.hw + 17 && Math.abs(it.y - P.y) < it.hh + 24) {
        if (it.k === 'candle') {
          it.dead = true; pts += 10; SP.sfx.coin(); burst(it.x, it.y, '#ffd21f', 10); say(it.x, it.y - 20, '+10', '#ffe66d');
        } else if (it.k === 'flower') {
          it.dead = true; pts += 5; SP.sfx.pop(); burst(it.x, it.y, '#ff8fd0', 8); say(it.x, it.y - 20, '+5', '#ffc2e8');
        } else if (inv <= 0) {
          it.dead = true; lives--; inv = 1.6; shake = 0.3; SP.sfx.hit(); burst(P.x, P.y, '#ffffff', 14);
          if (lives <= 0) { ctx.gameOver(total, 'กระทงล่มแล้ว!'); return; }
        }
      }
    }
    for (let i = items.length - 1; i >= 0; i--) if (items[i].dead || items[i].y > H + 80) items.splice(i, 1);

    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
    for (const x of texts) { x.y -= 40 * dt; x.life -= dt; }
    for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
    for (const r of ripples) { r.y += speed * dt * 0.85; if (r.y > H + 20) { r.y = -20; r.x = R(20, W - 20); } }
    for (const q of glints) { q.y += speed * dt * 0.9; if (q.y > H + 10) { q.y = -10; q.o = R(-60, 60); q.w = R(8, 34); } }
    for (const l of lanterns) { l.y -= l.v * dt; l.x += Math.sin(t + l.ph) * 8 * dt; if (l.y < -10) { l.y = H * 0.7; l.x = R(0, W); } }
  }

  function drawKrathong(x, y) {
    const sway = Math.sin(t * 3) * 0.06;
    g.save(); g.translate(x, y); g.rotate(sway);
    SP.glow(g, 0, 0, 62, 'rgba(255,200,60,0.55)', 0.5 + Math.sin(t * 9) * 0.1);
    // ใบตองพับรอบกระทง
    for (let i = 0; i < 14; i++) {
      g.save(); g.rotate(i * Math.PI * 2 / 14);
      g.fillStyle = i % 2 ? '#2f9e44' : '#51cf66';
      g.beginPath(); g.moveTo(-6, -17); g.lineTo(0, -33); g.lineTo(6, -17); g.closePath(); g.fill();
      g.restore();
    }
    g.fillStyle = '#2b8a3e'; g.beginPath(); g.arc(0, 0, 22, 0, 6.3); g.fill();
    // กลีบดอกไม้ชั้นนอก ชมพู
    for (let i = 0; i < 8; i++) {
      g.save(); g.rotate(i * Math.PI / 4 + 0.2);
      g.fillStyle = '#f783ac'; g.beginPath(); g.ellipse(0, -13, 5, 10, 0, 0, 6.3); g.fill();
      g.restore();
    }
    // กลีบชั้นใน ขาว
    for (let i = 0; i < 6; i++) {
      g.save(); g.rotate(i * Math.PI / 3);
      g.fillStyle = '#fff5f8'; g.beginPath(); g.ellipse(0, -7, 3.6, 7, 0, 0, 6.3); g.fill();
      g.restore();
    }
    // ธูปเทียน
    g.strokeStyle = '#7a4a1d'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(-5, 0); g.lineTo(-9, -22); g.moveTo(5, 0); g.lineTo(9, -22); g.stroke();
    g.fillStyle = '#ffd21f'; SP.rr(g, -3, -9, 6, 12, 2); g.fill();
    const fl = 1 + Math.sin(t * 14) * 0.15;
    g.fillStyle = '#fff3a8'; g.beginPath(); g.ellipse(0, -13, 3 * fl, 6 * fl, 0, 0, 6.3); g.fill();
    g.fillStyle = '#ff922b'; g.beginPath(); g.ellipse(0, -11, 1.6, 3.5, 0, 0, 6.3); g.fill();
    g.restore();
  }

  function drawItem(it) {
    g.save(); g.translate(it.x, it.y);
    if (it.k === 'candle') {
      SP.glow(g, 0, 0, 34, 'rgba(255,220,80,0.8)', 0.8);
      g.fillStyle = '#ffd21f'; g.beginPath(); g.arc(0, 4, 12, 0, 6.3); g.fill();
      g.fillStyle = '#e8a900'; g.beginPath(); g.arc(0, 8, 8, 0, Math.PI); g.fill();
      g.fillStyle = '#fff7c2'; g.beginPath(); g.ellipse(0, -9, 4.5, 9, 0, 0, 6.3); g.fill();
      g.fillStyle = '#ff922b'; g.beginPath(); g.ellipse(0, -7, 2.4, 5, 0, 0, 6.3); g.fill();
    } else if (it.k === 'flower') {
      g.rotate(it.rot + t * 0.5);
      for (let i = 0; i < 6; i++) {
        g.save(); g.rotate(i * Math.PI / 3);
        g.fillStyle = i % 2 ? '#ff8fd0' : '#ffb3e0'; g.beginPath(); g.ellipse(0, -10, 6, 11, 0, 0, 6.3); g.fill();
        g.restore();
      }
      g.fillStyle = '#ffe066'; g.beginPath(); g.arc(0, 0, 5, 0, 6.3); g.fill();
    } else if (it.k === 'rock') {
      g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(0, it.s * 0.5, it.s * 1.2, it.s * 0.35, 0, 0, 6.3); g.stroke();
      g.fillStyle = '#4a3a73'; g.beginPath(); g.ellipse(0, 0, it.s, it.s * 0.85, 0, 0, 6.3); g.fill();
      g.fillStyle = '#6b5a9c'; g.beginPath(); g.ellipse(-it.s * 0.25, -it.s * 0.25, it.s * 0.55, it.s * 0.4, -0.4, 0, 6.3); g.fill();
    } else {
      g.rotate(it.a);
      g.fillStyle = '#5b3a1e'; SP.rr(g, -it.w / 2, -13, it.w, 26, 13); g.fill();
      g.fillStyle = '#7a5230'; SP.rr(g, -it.w / 2 + 6, -9, it.w - 12, 9, 5); g.fill();
      g.fillStyle = '#c9a06b'; g.beginPath(); g.ellipse(-it.w / 2 + 5, 0, 6, 11, 0, 0, 6.3); g.fill();
      g.strokeStyle = '#5b3a1e'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(-it.w / 2 + 5, 0, 3, 6, 0, 0, 6.3); g.stroke();
    }
    g.restore();
  }

  function draw() {
    g.save();
    if (shake > 0) g.translate(R(-5, 5), R(-5, 5));
    // น้ำยามค่ำคืน
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a0640'); bg.addColorStop(0.55, '#2c0f66'); bg.addColorStop(1, '#3d1a85');
    g.fillStyle = bg; g.fillRect(-10, -10, W + 20, H + 20);
    // แสงจันทร์สะท้อน
    SP.glow(g, W * 0.72, 90, 220, 'rgba(255,230,120,0.30)', 1);
    g.fillStyle = 'rgba(255,230,140,0.55)';
    for (const q of glints) g.fillRect(W * 0.72 + q.o - q.w / 2, q.y, q.w, 2.5);
    // ริ้วคลื่น
    for (const r of ripples) {
      g.strokeStyle = 'rgba(200,180,255,' + r.a + ')'; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(r.x, r.y, r.r * 1.6, r.r * 0.5, 0, 0, 6.3); g.stroke();
    }
    // โคมลอยไกล ๆ
    for (const l of lanterns) {
      SP.glow(g, l.x, l.y, l.r * 6, 'rgba(255,190,60,0.55)', 0.6 + 0.3 * Math.sin(t * 2 + l.ph));
      g.fillStyle = '#ffd36b'; g.beginPath(); g.arc(l.x, l.y, l.r, 0, 6.3); g.fill();
    }
    // ริมตลิ่ง
    const bank = g.createLinearGradient(0, 0, 40, 0);
    bank.addColorStop(0, '#0d0224'); bank.addColorStop(1, 'rgba(13,2,36,0)');
    g.fillStyle = bank; g.fillRect(0, 0, 40, H);
    const bank2 = g.createLinearGradient(W, 0, W - 40, 0);
    bank2.addColorStop(0, '#0d0224'); bank2.addColorStop(1, 'rgba(13,2,36,0)');
    g.fillStyle = bank2; g.fillRect(W - 40, 0, 40, H);

    for (const it of items) drawItem(it);
    if (!(inv > 0 && Math.floor(t * 12) % 2)) drawKrathong(P.x, P.y);
    for (const s of sparks) {
      g.globalAlpha = clamp(s.life / s.max, 0, 1); g.fillStyle = s.c;
      g.beginPath(); g.arc(s.x, s.y, 3, 0, 6.3); g.fill();
    }
    g.globalAlpha = 1;
    g.font = '700 20px Prompt, sans-serif'; g.textAlign = 'center';
    for (const x of texts) { g.globalAlpha = clamp(x.life, 0, 1); g.fillStyle = x.c; g.fillText(x.s, x.x, x.y); }
    g.globalAlpha = 1;

    // หัวใจ
    for (let i = 0; i < 3; i++) {
      SP.heartPath(g, 30 + i * 32, 16, 24);
      g.fillStyle = i < lives ? '#ff4d8d' : 'rgba(255,255,255,0.18)'; g.fill();
    }
    // คำแนะนำช่วงแรก
    if (t < 4) {
      g.globalAlpha = clamp(4 - t, 0, 1);
      g.fillStyle = 'rgba(20,4,45,0.7)'; SP.rr(g, W / 2 - 170, H / 2 - 60, 340, 56, 16); g.fill();
      g.fillStyle = '#fff'; g.font = '600 18px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('ลากซ้าย-ขวาเพื่อบังคับกระทง', W / 2, H / 2 - 26);
      g.fillStyle = '#ffd21f'; g.font = '500 14px Prompt, sans-serif';
      g.fillText('เก็บประทีป 🕯 ดอกบัว หลบหินและซุง', W / 2, H / 2 - 6);
      g.globalAlpha = 1;
    }
    g.restore();
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* นักวิ่งนีออน — กระโดดข้ามหนามและบล็อก กระโดดซ้อนได้ 1 ครั้ง */
SP.register('neon-runner', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;
  const GROUND = H - 100, U = 44;   // U = ขนาดหนึ่งช่อง

  const P = { x: 170, y: GROUND, vy: 0, w: 38, h: 38, rot: 0, jumps: 0, onGround: true };
  let speed = 340, dist = 0, coins = 0, t = 0, nextX = W + 200, trail = [];
  const obs = [], pickups = [], sparks = [], texts = [];

  const GRAV = 2500, JUMP = 880, JUMP2 = 760;

  function jump() {
    if (P.onGround) { P.vy = -JUMP; P.onGround = false; P.jumps = 1; SP.sfx.jump(); }
    else if (P.jumps < 2) { P.vy = -JUMP2; P.jumps = 2; SP.sfx.jump(); burst(P.x + P.w / 2, P.y, '#ffd21f', 8); }
  }
  function burst(x, y, c, n) {
    for (let i = 0; i < n; i++) { const a = R(0, 6.28), v = R(40, 160); sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.25, 0.6), c }); }
  }

  ctx.on(ctx.canvas, 'pointerdown', () => jump());
  ctx.on(window, 'keydown', e => { if (!e.repeat && (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W')) jump(); });

  function addGroup() {
    const r = Math.random(), x = nextX;
    let width = U;
    if (r < 0.3) { obs.push({ k: 'spike', x, y: GROUND, w: U, h: U }); }
    else if (r < 0.48) { obs.push({ k: 'spike', x, y: GROUND, w: U, h: U }, { k: 'spike', x: x + U, y: GROUND, w: U, h: U }); width = U * 2; }
    else if (r < 0.66) { obs.push({ k: 'block', x, y: GROUND, w: U, h: U }); pickups.push({ x: x + U / 2, y: GROUND - U - 40 }); }
    else if (r < 0.82) {
      obs.push({ k: 'block', x, y: GROUND, w: U, h: U }, { k: 'block', x: x + U, y: GROUND, w: U, h: U * 2 });
      pickups.push({ x: x + U * 1.5, y: GROUND - U * 2 - 40 }); width = U * 2;
    } else {
      obs.push({ k: 'block', x, y: GROUND, w: U * 3, h: U }, { k: 'spike', x: x + U * 3, y: GROUND, w: U, h: U });
      pickups.push({ x: x + U * 1.5, y: GROUND - U - 40 }); width = U * 4;
    }
    if (Math.random() < 0.5) for (let i = 0; i < 3; i++) pickups.push({ x: x + width + 80 + i * 36, y: GROUND - 90 - Math.sin(i * 1.5) * 20 });
    nextX = x + width + Math.max(260, speed * 0.78) + R(0, 160);
  }

  function die() {
    SP.sfx.hit(); burst(P.x + 19, P.y - 19, '#ffd21f', 24);
    ctx.gameOver(Math.floor(dist / 12) + coins * 5, 'ชนเข้าแล้ว!');
  }

  function update(dt) {
    t += dt;
    speed = 340 + Math.min(300, t * 6);
    dist += speed * dt;
    ctx.setScore(Math.floor(dist / 12) + coins * 5);
    while (nextX < W + 300) addGroup();
    nextX -= speed * dt;
    for (const o of obs) o.x -= speed * dt;
    for (const c of pickups) c.x -= speed * dt;

    const prevBottom = P.y;
    P.vy += GRAV * dt;
    P.y += P.vy * dt;
    let support = GROUND;
    const L = P.x + 6, Rr = P.x + P.w - 6;
    for (const o of obs) {
      if (o.k !== 'block') continue;
      if (Rr > o.x && L < o.x + o.w) {
        const top = o.y - o.h;
        if (prevBottom <= top + 6 && P.y >= top && P.vy >= 0) support = Math.min(support, top);   // ลงบนบล็อก
        else if (P.y > top + 6 && prevBottom > top + 6 && P.y - P.h < o.y) { die(); return; }       // ชนด้านข้าง
      }
    }
    if (P.y >= support) { P.y = support; P.vy = 0; P.onGround = true; P.jumps = 0; P.rot = Math.round(P.rot / (Math.PI / 2)) * (Math.PI / 2); }
    else { P.onGround = false; P.rot += dt * 7; }

    for (const o of obs) {
      if (o.k !== 'spike') continue;
      const hx = o.x + o.w * 0.28, hw = o.w * 0.44, hy = o.y - o.h * 0.7;
      if (P.x + P.w - 7 > hx && P.x + 7 < hx + hw && P.y > hy + 4 && P.y - P.h < o.y) { die(); return; }
    }
    for (const c of pickups) {
      if (!c.got && Math.hypot(c.x - (P.x + P.w / 2), c.y - (P.y - P.h / 2)) < 30) {
        c.got = true; coins++; SP.sfx.coin(); burst(c.x, c.y, '#ffd21f', 6);
      }
    }
    for (let i = obs.length - 1; i >= 0; i--) if (obs[i].x < -200) obs.splice(i, 1);
    for (let i = pickups.length - 1; i >= 0; i--) if (pickups[i].got || pickups[i].x < -50) pickups.splice(i, 1);

    trail.push({ x: P.x + P.w / 2, y: P.y - P.h / 2, life: 0.3 });
    for (const tr of trail) { tr.life -= dt; tr.x -= speed * dt; }
    trail = trail.filter(tr => tr.life > 0);
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
  }

  function draw() {
    const bg = g.createLinearGradient(0, 0, 0, GROUND);
    bg.addColorStop(0, '#1a0638'); bg.addColorStop(1, '#5b21b6');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    // ดวงอาทิตย์นีออน
    const sg = g.createLinearGradient(0, 80, 0, 260);
    sg.addColorStop(0, '#ffe66d'); sg.addColorStop(1, '#ff4fa3');
    g.save(); g.beginPath(); g.arc(W * 0.7, 190, 100, 0, 6.3); g.clip();
    g.fillStyle = sg; g.fillRect(0, 0, W, H);
    g.fillStyle = '#3b0f86';
    for (let i = 0; i < 6; i++) g.fillRect(W * 0.7 - 110, 200 + i * 16, 220, 3 + i * 1.6);
    g.restore();
    // เส้นขอบฟ้าและกริด
    g.strokeStyle = 'rgba(255,210,31,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, GROUND); g.lineTo(W, GROUND); g.stroke();
    g.fillStyle = '#22084d'; g.fillRect(0, GROUND, W, H - GROUND);
    g.strokeStyle = 'rgba(167,139,250,0.35)'; g.lineWidth = 1.5;
    const off = (dist * 0.9) % 60;
    for (let x = -off; x < W + 60; x += 60) { g.beginPath(); g.moveTo(x, GROUND); g.lineTo(x - (x - W / 2) * 0.9, H); g.stroke(); }
    for (let i = 1; i < 5; i++) { const y = GROUND + i * i * 5.5; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    // ตึกไกล ๆ
    g.fillStyle = 'rgba(30,8,70,0.85)';
    for (let i = 0; i < 12; i++) {
      const x = ((i * 90 - dist * 0.25) % (W + 180) + W + 180) % (W + 180) - 90;
      const h = 60 + (i * 37) % 90; g.fillRect(x, GROUND - h, 56, h);
    }

    for (const c of pickups) {
      SP.glow(g, c.x, c.y, 24, 'rgba(255,210,31,0.8)', 0.8);
      g.fillStyle = '#ffd21f'; g.beginPath(); g.arc(c.x, c.y, 10, 0, 6.3); g.fill();
      g.fillStyle = '#b37a00'; g.font = '800 12px Prompt, sans-serif'; g.textAlign = 'center'; g.fillText('฿', c.x, c.y + 4);
    }
    for (const o of obs) {
      if (o.k === 'block') {
        g.fillStyle = '#7c3aed'; g.fillRect(o.x, o.y - o.h, o.w, o.h);
        g.strokeStyle = '#ffd21f'; g.lineWidth = 3; g.strokeRect(o.x + 1.5, o.y - o.h + 1.5, o.w - 3, o.h - 3);
        g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 1;
        for (let yy = o.y - o.h + U; yy < o.y; yy += U) { g.beginPath(); g.moveTo(o.x, yy); g.lineTo(o.x + o.w, yy); g.stroke(); }
        for (let xx = o.x + U; xx < o.x + o.w; xx += U) { g.beginPath(); g.moveTo(xx, o.y - o.h); g.lineTo(xx, o.y); g.stroke(); }
      } else {
        g.fillStyle = '#ff4fa3'; g.beginPath(); g.moveTo(o.x, o.y); g.lineTo(o.x + o.w / 2, o.y - o.h); g.lineTo(o.x + o.w, o.y); g.closePath(); g.fill();
        g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
      }
    }
    for (const tr of trail) { g.globalAlpha = tr.life * 1.5; g.fillStyle = '#ffd21f'; g.fillRect(tr.x - 8, tr.y - 8, 16, 16); }
    g.globalAlpha = 1;
    // ผู้เล่น
    g.save(); g.translate(P.x + P.w / 2, P.y - P.h / 2); g.rotate(P.rot);
    SP.glow(g, 0, 0, 40, 'rgba(255,210,31,0.5)', 0.8);
    g.fillStyle = '#ffd21f'; SP.rr(g, -P.w / 2, -P.h / 2, P.w, P.h, 8); g.fill();
    g.strokeStyle = '#2a0b55'; g.lineWidth = 3; SP.rr(g, -P.w / 2, -P.h / 2, P.w, P.h, 8); g.stroke();
    g.fillStyle = '#2a0b55'; g.fillRect(-12, -9, 8, 9); g.fillRect(4, -9, 8, 9);
    g.fillRect(-10, 8, 20, 4);
    g.restore();
    for (const s of sparks) { g.globalAlpha = clamp(s.life * 3, 0, 1); g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, 3, 0, 6.3); g.fill(); }
    g.globalAlpha = 1;
    g.fillStyle = '#ffd21f'; g.font = '700 18px Prompt, sans-serif'; g.textAlign = 'right';
    g.fillText('🪙 ' + coins, W - 16, 30);
    if (t < 3.5) {
      g.globalAlpha = clamp(3.5 - t, 0, 1);
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 200, 90, 400, 46, 14); g.fill();
      g.fillStyle = '#fff'; g.font = '600 18px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('แตะ / Space เพื่อกระโดด — กระโดดซ้อนได้ 2 ครั้ง', W / 2, 119);
      g.globalAlpha = 1;
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* 2048 ม่วงทอง — เลื่อนตัวเลขให้เท่ากันรวมกัน (DOM) */
SP.register('puzzle-2048', function (ctx) {
  const N = 4;
  const COLORS = {
    2: ['#ede4ff', '#4c1d95'], 4: ['#d9c8ff', '#4c1d95'], 8: ['#b794f6', '#fff'], 16: ['#9f6bf2', '#fff'],
    32: ['#8248e8', '#fff'], 64: ['#6d28d9', '#fff'], 128: ['#ffe27a', '#4c1d95'], 256: ['#ffd21f', '#4c1d95'],
    512: ['#ffbd14', '#4c1d95'], 1024: ['#ff9f0a', '#fff'], 2048: ['#ff7a00', '#fff']
  };
  let grid, score = 0, won = false, over = false, nid = 1;
  let tiles = {};                       // id -> {el, r, c, v}
  const root = ctx.root;

  root.innerHTML =
    '<div class="t48"><div class="t48-top"><h2>2048</h2>' +
    '<div style="display:flex;gap:.5em"><div class="t48-box">คะแนน<b data-s>0</b></div><div class="t48-box">สูงสุด<b data-b>0</b></div></div></div>' +
    '<div class="t48-hint">รวมเลขที่เท่ากันให้ถึง <b style="color:#ffd21f">2048</b> — ปัดนิ้วหรือกดลูกศร</div>' +
    '<div class="t48-board"><div class="t48-cells"></div><div class="t48-tiles"></div></div></div>';
  const cellsEl = root.querySelector('.t48-cells'), tilesEl = root.querySelector('.t48-tiles');
  const sEl = root.querySelector('[data-s]'), bEl = root.querySelector('[data-b]');
  bEl.textContent = SP.fmt(ctx.best);

  const STEP = 25.3;                    // ระยะเป็น % ของพื้นที่กระดาน
  for (let i = 0; i < N * N; i++) {
    const d = document.createElement('div'); d.className = 't48-cell';
    d.style.left = (i % N) * STEP + '%'; d.style.top = Math.floor(i / N) * STEP + '%';
    cellsEl.appendChild(d);
  }

  grid = Array.from({ length: N }, () => Array(N).fill(null));

  function place(el, r, c) { el.style.left = c * STEP + '%'; el.style.top = r * STEP + '%'; }
  function paint(el, v) {
    const col = COLORS[v] || ['#ff5500', '#fff'];
    el.style.background = col[0]; el.style.color = col[1];
    el.textContent = String(v);
    el.className = 't48-tile' + (v >= 1000 ? ' d4' : v >= 100 ? ' d3' : '');
  }
  function addTile(r, c, v, isNew) {
    const el = document.createElement('div');
    paint(el, v); place(el, r, c);
    if (isNew) el.classList.add('new');
    tilesEl.appendChild(el);
    const t = { id: nid++, el, r, c, v };
    grid[r][c] = t; return t;
  }
  function spawn() {
    const empty = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    const p = SP.pick(empty);
    addTile(p[0], p[1], Math.random() < 0.9 ? 2 : 4, true);
  }

  function canMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
      if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  function move(dr, dc) {
    if (over) return;
    let moved = false, gain = 0;
    const order = [];
    for (let i = 0; i < N; i++) order.push(i);
    const rs = dr > 0 ? order.slice().reverse() : order, cs = dc > 0 ? order.slice().reverse() : order;
    const merged = new Set();
    const toRemove = [];
    for (const r of rs) for (const c of cs) {
      const t = grid[r][c]; if (!t) continue;
      let nr = r, nc = c;
      while (true) {
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tc < 0 || tr >= N || tc >= N) break;
        const o = grid[tr][tc];
        if (!o) { nr = tr; nc = tc; continue; }
        if (o.v === t.v && !merged.has(o.id)) { nr = tr; nc = tc; }
        break;
      }
      if (nr === r && nc === c) continue;
      const target = grid[nr][nc];
      grid[r][c] = null;
      if (target) {   // รวมกัน
        merged.add(target.id);
        target.v *= 2; gain += target.v; t.r = nr; t.c = nc; place(t.el, nr, nc);
        toRemove.push({ t, into: target });
      } else { grid[nr][nc] = t; t.r = nr; t.c = nc; place(t.el, nr, nc); }
      moved = true;
    }
    if (!moved) return;
    SP.sfx.click();
    setTimeout(() => {
      for (const m of toRemove) {
        m.t.el.remove();
        paint(m.into.el, m.into.v); m.into.el.classList.add('merge');
        setTimeout(() => m.into.el.classList.remove('merge'), 220);
      }
    }, 120);
    if (gain) { score += gain; sEl.textContent = SP.fmt(score); ctx.setScore(score); SP.sfx.pop(); }
    spawn();
    if (!won) {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] && grid[r][c].v >= 2048) {
        won = true; SP.sfx.win();
        const toast = document.createElement('div'); toast.className = 't48-toast'; toast.textContent = '🎉 ถึง 2048 แล้ว! เล่นต่อได้เลย';
        root.querySelector('.t48').appendChild(toast); ctx.after(() => toast.remove(), 2200);
      }
    }
    if (!canMove()) { over = true; ctx.after(() => ctx.gameOver(score, 'กระดานเต็มแล้ว'), 500); }
  }

  ctx.on(window, 'keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') move(-1, 0);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') move(1, 0);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(0, -1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(0, 1);
  });
  let sx = 0, sy = 0, tracking = false;
  ctx.on(root, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; tracking = true; });
  ctx.on(window, 'pointerup', e => {
    if (!tracking) return; tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1); else move(dy > 0 ? 1 : -1, 0);
  });

  ctx.setScore(0);
  spawn(); spawn();
});

/* ระนาดเอกฮีโร่ — เกมจังหวะ 4 ช่องทาง ตีให้ตรงจังหวะแล้วเสียงระนาดจะดังเป็นทำนอง */
SP.register('ranad-hero', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const clamp = SP.clamp;
  const LANES = 4, LW = W / LANES, HIT_Y = H - 120, TRAVEL = 1.55;
  const SPEED = (HIT_Y + 40) / TRAVEL;
  const FREQ = [523.25, 587.33, 659.25, 783.99];            // ซอล-ลา-ที-เร ในบันไดเสียงเพนทาโทนิก
  const NAMES = ['โด', 'เร', 'มี', 'ซอล'];
  const COLORS = ['#ffd21f', '#ff9f43', '#ffd21f', '#ff9f43'];
  const KEYS = { d: 0, f: 1, j: 2, k: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3, D: 0, F: 1, J: 2, K: 3 };

  /* ---------- สร้างโน้ตเพลง (ทำนองลายไทยจากบันไดเสียงเพนทาโทนิก) ---------- */
  const A = [0, 1, 2, -1, 2, 1, 0, -1, 1, 2, 3, -1, 3, 2, 1, -1];
  const B = [2, 3, 2, 1, 2, -1, 0, -1, 0, 1, 2, 3, 2, 1, 0, -1];
  const C = [0, 0, 1, 2, 3, -1, 3, 2, 1, 1, 2, 3, 3, 2, 1, 0];
  const SONG = [A, A, B, A, B, C, A, C, B, C];
  const STEP = 0.28, LEAD = 2.2;
  const notes = [];
  SONG.forEach((ph, pi) => {
    ph.forEach((lane, si) => {
      if (lane < 0) return;
      const time = LEAD + (pi * 16 + si) * STEP;
      notes.push({ lane, time, done: false });
      if (pi >= 4 && si % 4 === 0) notes.push({ lane: (lane + 2) % LANES, time, done: false });
    });
  });
  const END = notes[notes.length - 1].time + 1.2;

  let songT = 0, score = 0, combo = 0, best = 0, energy = 100, perfect = 0, good = 0, miss = 0;
  const flash = [0, 0, 0, 0], pops = [], sparks = [];
  let t = 0;

  function judge(txt, color, lane) { pops.push({ txt, color, x: lane * LW + LW / 2, y: HIT_Y - 70, life: 0.6 }); }

  function press(lane) {
    flash[lane] = 0.18;
    let n = null;
    for (const q of notes) {
      if (q.done || q.lane !== lane) continue;
      const d = Math.abs(q.time - songT);
      if (d <= 0.15 && (!n || d < Math.abs(n.time - songT))) n = q;
    }
    if (!n) {
      SP.tone(180, 0.06, 'triangle', 0.06);       // ตีเปล่า เสียงทึบ ๆ
      energy = Math.max(0, energy - 2);
      return;
    }
    n.done = true; n.hit = true;
    const d = Math.abs(n.time - songT);
    const isPerfect = d <= 0.07;
    combo++; best = Math.max(best, combo);
    const mult = 1 + Math.floor(combo / 10) * 0.2;
    score += Math.round((isPerfect ? 100 : 50) * mult);
    if (isPerfect) { perfect++; judge('Perfect', '#ffe066', lane); energy = Math.min(100, energy + 2); }
    else { good++; judge('Good', '#7cf3ff', lane); energy = Math.min(100, energy + 1); }
    ctx.setScore(score);
    SP.sfx.ranad(FREQ[lane]);
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * 6.28, v = 60 + Math.random() * 140;
      sparks.push({ x: lane * LW + LW / 2, y: HIT_Y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.5, c: isPerfect ? '#ffe066' : '#7cf3ff' });
    }
  }

  ctx.on(window, 'keydown', e => {
    if (e.repeat) return;
    const l = KEYS[e.key];
    if (l !== undefined) press(l);
  });
  ctx.on(ctx.canvas, 'pointerdown', e => {
    const p = ctx.pos(e);
    press(clamp(Math.floor(p.x / LW), 0, LANES - 1));
  });

  function update(dt) {
    t += dt; songT += dt;
    for (let i = 0; i < LANES; i++) if (flash[i] > 0) flash[i] -= dt;
    for (const q of notes) {
      if (!q.done && songT - q.time > 0.16) {
        q.done = true; q.missed = true; miss++; combo = 0; energy -= 9;
        judge('พลาด', '#ff7b7b', q.lane); SP.tone(130, 0.12, 'sawtooth', 0.05);
      }
    }
    for (const p of pops) { p.y -= 40 * dt; p.life -= dt; }
    for (let i = pops.length - 1; i >= 0; i--) if (pops[i].life <= 0) pops.splice(i, 1);
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; s.life -= dt; }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
    if (energy <= 0) { ctx.gameOver(score, 'พลังหมดก่อนจบเพลง'); return; }
    if (songT > END) {
      const bonus = Math.round(energy) * 5;
      ctx.gameOver(score + bonus, 'จบเพลง! 🎉 โบนัสพลัง +' + bonus);
    }
  }

  function drawNote(x, y, lane) {
    SP.glow(g, x, y, 50, 'rgba(255,210,31,0.55)', 0.7);
    const gr = g.createLinearGradient(x, y - 20, x, y + 20);
    gr.addColorStop(0, '#fff3a8'); gr.addColorStop(1, COLORS[lane]);
    g.fillStyle = gr; SP.rr(g, x - 44, y - 17, 88, 34, 17); g.fill();
    g.strokeStyle = '#7a4a10'; g.lineWidth = 2.5; SP.rr(g, x - 44, y - 17, 88, 34, 17); g.stroke();
    g.fillStyle = '#7a4a10'; g.beginPath(); g.arc(x - 28, y, 3, 0, 6.3); g.arc(x + 28, y, 3, 0, 6.3); g.fill();
  }

  function draw() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#14052e'); bg.addColorStop(1, '#3a1380');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    // ลวดลายจาง ๆ
    g.strokeStyle = 'rgba(255,210,31,0.05)'; g.lineWidth = 1.5;
    for (let i = 0; i < 10; i++) { g.beginPath(); g.arc(W / 2, 220, 40 + i * 34, 0, 6.3); g.stroke(); }
    // ช่องทาง
    for (let i = 0; i < LANES; i++) {
      const f = clamp(flash[i] / 0.18, 0, 1);
      if (f > 0) {
        const gr = g.createLinearGradient(0, HIT_Y - 260, 0, HIT_Y + 40);
        gr.addColorStop(0, 'rgba(255,210,31,0)'); gr.addColorStop(1, 'rgba(255,210,31,' + (0.4 * f) + ')');
        g.fillStyle = gr; g.fillRect(i * LW, HIT_Y - 260, LW, 300);
      }
      if (i) { g.strokeStyle = 'rgba(255,210,31,0.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(i * LW, 0); g.lineTo(i * LW, H); g.stroke(); }
    }
    // โน้ตที่กำลังลงมา
    for (const q of notes) {
      if (q.done) continue;
      const y = HIT_Y - (q.time - songT) * SPEED;
      if (y < -40 || y > H + 40) continue;
      drawNote(q.lane * LW + LW / 2, y, q.lane);
    }
    // เส้นตี + ลูกระนาด
    g.fillStyle = 'rgba(255,210,31,0.9)'; g.fillRect(0, HIT_Y - 2, W, 4);
    for (let i = 0; i < LANES; i++) {
      const x = i * LW + LW / 2, f = clamp(flash[i] / 0.18, 0, 1);
      const bar = g.createLinearGradient(0, HIT_Y + 14, 0, HIT_Y + 66);
      bar.addColorStop(0, f > 0 ? '#ffe9a0' : '#b8742a'); bar.addColorStop(1, f > 0 ? '#ffd21f' : '#6b3a10');
      g.fillStyle = bar; SP.rr(g, x - 46, HIT_Y + 14 + f * 4, 92, 52, 14); g.fill();
      g.strokeStyle = '#ffd21f'; g.lineWidth = 3; SP.rr(g, x - 46, HIT_Y + 14 + f * 4, 92, 52, 14); g.stroke();
      g.fillStyle = f > 0 ? '#3a1280' : '#ffe9a0'; g.font = '700 18px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText(NAMES[i], x, HIT_Y + 46 + f * 4);
    }
    g.fillStyle = 'rgba(255,255,255,0.55)'; g.font = '500 13px Prompt, sans-serif'; g.textAlign = 'center';
    ['D', 'F', 'J', 'K'].forEach((k, i) => g.fillText(k, i * LW + LW / 2, H - 14));

    for (const s of sparks) { g.globalAlpha = clamp(s.life * 2, 0, 1); g.fillStyle = s.c; g.beginPath(); g.arc(s.x, s.y, 3, 0, 6.3); g.fill(); }
    g.globalAlpha = 1;
    g.font = '800 24px Prompt, sans-serif'; g.textAlign = 'center';
    for (const p of pops) {
      g.globalAlpha = clamp(p.life * 2.2, 0, 1);
      g.lineWidth = 4; g.strokeStyle = 'rgba(20,4,45,0.85)'; g.strokeText(p.txt, p.x, p.y);
      g.fillStyle = p.color; g.fillText(p.txt, p.x, p.y);
    }
    g.globalAlpha = 1;

    // พลัง
    g.fillStyle = 'rgba(0,0,0,0.5)'; SP.rr(g, 14, 14, W - 28, 14, 7); g.fill();
    g.fillStyle = energy < 30 ? '#ff5d5d' : '#ffd21f'; SP.rr(g, 14, 14, Math.max(8, (W - 28) * clamp(energy / 100, 0, 1)), 14, 7); g.fill();
    // ความคืบหน้าเพลง
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(14, 34, (W - 28) * clamp(songT / END, 0, 1), 3);
    if (combo >= 3) {
      g.fillStyle = '#fff'; g.font = '800 36px Prompt, sans-serif'; g.textAlign = 'center';
      g.lineWidth = 5; g.strokeStyle = 'rgba(20,4,45,0.85)'; g.strokeText(combo + ' คอมโบ', W / 2, 140); g.fillText(combo + ' คอมโบ', W / 2, 140);
    }
    if (songT < LEAD - 0.4) {
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 190, 230, 380, 90, 18); g.fill();
      g.fillStyle = '#ffd21f'; g.font = '800 28px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('เตรียมตัว...', W / 2, 270);
      g.fillStyle = '#fff'; g.font = '500 16px Prompt, sans-serif';
      g.fillText('แตะช่องทาง หรือกด D F J K ให้ตรงจังหวะ', W / 2, 300);
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* งูเขียวนักกิน — เกมงูคลาสสิก ปัดนิ้วหรือกดลูกศร */
SP.register('snake-classic', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;
  const N = 20, C = W / N;

  let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  let dir = { x: 1, y: 0 }, queue = [], acc = 0, score = 0, t = 0, grow = 0;
  let food = null, gold = null, goldT = 0, parts = [], eaten = 0;
  const FRUITS = ['🍎', '🍊', '🍇', '🍓', '🥭', '🍍'];
  let fruit = FRUITS[0];

  function free(x, y) { return !snake.some(s => s.x === x && s.y === y) && !(food && food.x === x && food.y === y) && !(gold && gold.x === x && gold.y === y); }
  function randCell() {
    for (let i = 0; i < 400; i++) { const x = SP.irand(0, N - 1), y = SP.irand(0, N - 1); if (free(x, y)) return { x, y }; }
    return null;
  }
  food = randCell();

  function setDir(dx, dy) {
    const last = queue.length ? queue[queue.length - 1] : dir;
    if ((dx === -last.x && dy === -last.y) || (dx === last.x && dy === last.y)) return;
    if (queue.length < 3) queue.push({ x: dx, y: dy });
  }
  ctx.on(window, 'keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
  });
  let sx = 0, sy = 0, sw = false;
  ctx.on(ctx.canvas, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; sw = true; });
  ctx.on(ctx.canvas, 'pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 24) {
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
      sx = e.clientX; sy = e.clientY;
    }
  });
  ctx.on(window, 'pointerup', () => { sw = false; });

  function burst(x, y, c) {
    for (let i = 0; i < 10; i++) { const a = R(0, 6.28), v = R(40, 140); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.3, 0.6), c }); }
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.slice(0, snake.length - (grow > 0 ? 0 : 1)).some(s => s.x === h.x && s.y === h.y)) {
      SP.sfx.hit(); ctx.gameOver(score, 'งูชนแล้ว!'); return false;
    }
    snake.unshift(h);
    if (food && h.x === food.x && h.y === food.y) {
      score += 10; grow += 1; eaten++; SP.sfx.pop(); burst(h.x * C + C / 2, h.y * C + C / 2, '#ff6b6b');
      fruit = SP.pick(FRUITS); food = randCell();
      if (eaten % 5 === 0 && !gold) { gold = randCell(); goldT = 7; }
    } else if (gold && h.x === gold.x && h.y === gold.y) {
      score += 30; grow += 2; SP.sfx.coin(); burst(h.x * C + C / 2, h.y * C + C / 2, '#ffd21f'); gold = null;
    }
    if (grow > 0) grow--; else snake.pop();
    ctx.setScore(score);
    return true;
  }

  function update(dt) {
    t += dt;
    const interval = Math.max(0.065, 0.15 - snake.length * 0.0018);
    acc += dt;
    while (acc >= interval) { acc -= interval; if (!step()) return; }
    if (gold) { goldT -= dt; if (goldT <= 0) gold = null; }
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);
  }

  function draw() {
    g.fillStyle = '#1a0638'; g.fillRect(0, 0, W, H);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      g.fillStyle = (x + y) % 2 ? '#2a0d5c' : '#240a52'; g.fillRect(x * C, y * C, C, C);
    }
    g.font = (C * 0.8) + 'px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (food) g.fillText(fruit, food.x * C + C / 2, food.y * C + C / 2 + 2);
    if (gold) {
      SP.glow(g, gold.x * C + C / 2, gold.y * C + C / 2, C, 'rgba(255,210,31,0.8)', 0.8);
      SP.starPath(g, gold.x * C + C / 2, gold.y * C + C / 2, C * 0.45, C * 0.2, 5, t * 2);
      g.fillStyle = '#ffd21f'; g.fill();
      if (goldT < 2 && Math.floor(t * 8) % 2) { g.fillStyle = 'rgba(26,6,56,0.6)'; g.fill(); }
    }
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i], k = 1 - i / (snake.length + 6) * 0.5;
      g.fillStyle = i % 2 ? 'rgb(' + Math.round(160 * k) + ',' + Math.round(230 * k) + ',' + Math.round(50 * k) + ')' : 'rgb(' + Math.round(130 * k) + ',' + Math.round(210 * k) + ',' + Math.round(40 * k) + ')';
      SP.rr(g, s.x * C + 1.5, s.y * C + 1.5, C - 3, C - 3, i === 0 ? 8 : 6); g.fill();
    }
    const h = snake[0], hx = h.x * C + C / 2, hy = h.y * C + C / 2;
    g.fillStyle = '#ffd21f'; g.beginPath(); g.arc(hx + dir.x * 3, hy + dir.y * 3, C * 0.12 + 4, 0, 6.3);
    g.fillStyle = '#fff';
    const px = -dir.y, py = dir.x;
    [[-1], [1]].forEach(m => {
      const ex = hx + dir.x * 4 + px * m[0] * 5, ey = hy + dir.y * 4 + py * m[0] * 5;
      g.fillStyle = '#fff'; g.beginPath(); g.arc(ex, ey, 3.6, 0, 6.3); g.fill();
      g.fillStyle = '#2a0b55'; g.beginPath(); g.arc(ex + dir.x, ey + dir.y, 1.8, 0, 6.3); g.fill();
    });
    g.textBaseline = 'alphabetic';
    for (const p of parts) { g.globalAlpha = clamp(p.life * 3, 0, 1); g.fillStyle = p.c; g.fillRect(p.x - 2, p.y - 2, 4, 4); }
    g.globalAlpha = 1;
    if (t < 3 && snake.length <= 3) {
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 170, H / 2 + 50, 340, 42, 14); g.fill();
      g.fillStyle = '#fff'; g.font = '600 17px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('กดลูกศร หรือปัดนิ้วเพื่อเลี้ยว', W / 2, H / 2 + 77);
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* สงกรานต์สาดน้ำ — สาดน้ำเพื่อน ๆ แต่ห้ามสาดพระสงฆ์และผู้ใหญ่ */
SP.register('songkran-splash', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;

  const TOTAL = 45;
  let timeLeft = TOTAL, elapsed = 0, score = 0, combo = 0, spawnT = 0.6, t = 0;
  const holes = [];
  [[170, 290], [400, 290], [630, 290], [170, 440], [400, 440], [630, 440]].forEach(p => holes.push({ x: p[0], y: p[1], p: null }));
  const drops = [], texts = [];

  const SHIRTS = ['#ff6b9d', '#4dd0e1', '#ffca28', '#81c784', '#ff8a65'];
  const SKINS = ['#f1c27d', '#e0ac69', '#c68642', '#ffdbac'];

  function spawn() {
    const free = holes.filter(h => !h.p);
    if (!free.length) return;
    const maxActive = elapsed < 15 ? 3 : elapsed < 30 ? 4 : 5;
    if (holes.length - free.length >= maxActive) return;
    const h = SP.pick(free), r = Math.random();
    const kind = r < 0.6 ? 'friend' : r < 0.74 ? 'monk' : r < 0.88 ? 'elder' : 'elephant';
    const fast = Math.max(0.6, 1 - elapsed * 0.009);
    h.p = {
      kind, st: 'up', rise: 0, tm: 0, wet: 0,
      stay: (kind === 'friend' ? R(1.0, 1.6) : kind === 'elephant' ? 1.3 : 1.6) * fast,
      shirt: SP.pick(SHIRTS), skin: SP.pick(SKINS), flower: Math.floor(R(0, 3))
    };
  }

  function say(x, y, s, c) { texts.push({ x, y, s, c, life: 1 }); }
  function splash(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = R(0, 6.28), v = R(60, 260);
      drops.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, life: R(0.4, 0.8) });
    }
  }

  ctx.on(ctx.canvas, 'pointerdown', e => {
    const p = ctx.pos(e);
    splash(p.x, p.y, 12); SP.sfx.splash();
    for (const h of holes) {
      const q = h.p;
      if (!q || q.st === 'hit' || q.st === 'down' || q.rise < 0.35) continue;
      const sc = q.kind === 'elephant' ? 1.25 : 1;
      const top = h.y - 118 * q.rise * sc;
      if (Math.abs(p.x - h.x) < 50 * sc && p.y > top - 6 && p.y < h.y + 6) {
        q.st = 'hit'; q.tm = 0; q.wet = 1;
        splash(h.x, h.y - 60 * q.rise, 18);
        if (q.kind === 'friend') {
          combo++;
          const m = 1 + Math.min(4, Math.floor(combo / 4));
          score += 10 * m; SP.sfx.pop();
          say(h.x, h.y - 130, '+' + 10 * m, '#ffe066');
        } else if (q.kind === 'elephant') {
          score += 50; timeLeft = Math.min(TOTAL + 10, timeLeft + 3); combo++; SP.sfx.coin();
          say(h.x, h.y - 150, 'ช้างช่วย! +50 / +3วิ', '#7cf3ff');
        } else {
          score = Math.max(0, score - 20); timeLeft = Math.max(0, timeLeft - 3); combo = 0; SP.sfx.hit();
          say(h.x, h.y - 130, q.kind === 'monk' ? 'ไม่สุภาพนะ 🙏 -20' : 'เคารพผู้ใหญ่ 🙏 -20', '#ff7b7b');
        }
        ctx.setScore(score);
        break;
      }
    }
  });

  function update(dt) {
    t += dt; elapsed += dt; timeLeft -= dt;
    if (timeLeft <= 0) { ctx.gameOver(score, 'หมดเวลาสงกรานต์!'); return; }
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 0.95 - elapsed * 0.012) * R(0.8, 1.2); }

    for (const h of holes) {
      const q = h.p; if (!q) continue;
      q.tm += dt;
      if (q.st === 'up') { q.rise = clamp(q.tm / 0.18, 0, 1); if (q.rise >= 1) { q.st = 'stay'; q.tm = 0; } }
      else if (q.st === 'stay') {
        q.rise = 1;
        if (q.tm >= q.stay) { q.st = 'down'; q.tm = 0; if (q.kind === 'friend') combo = 0; }
      } else if (q.st === 'hit') { if (q.tm >= 0.45) { q.st = 'down'; q.tm = 0; } }
      else if (q.st === 'down') { q.rise = clamp(1 - q.tm / 0.2, 0, 1); if (q.rise <= 0) h.p = null; }
    }
    for (const d of drops) { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 700 * dt; d.life -= dt; }
    for (let i = drops.length - 1; i >= 0; i--) if (drops[i].life <= 0) drops.splice(i, 1);
    for (const x of texts) { x.y -= 36 * dt; x.life -= dt; }
    for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
  }

  function drawPerson(h) {
    const q = h.p, sc = q.kind === 'elephant' ? 1.25 : 1;
    g.save();
    g.beginPath(); g.rect(h.x - 90, h.y - 190, 180, 190 + 4); g.clip();
    g.translate(h.x, h.y + (1 - q.rise) * 130);
    g.scale(sc, sc);
    const bob = q.st === 'stay' ? Math.sin(t * 8 + h.x) * 2 : 0;
    g.translate(0, bob);
    const wet = q.wet > 0;
    if (q.kind === 'elephant') {
      g.fillStyle = '#8e8aa8';
      g.beginPath(); g.arc(-34, -62, 24, 0, 6.3); g.arc(34, -62, 24, 0, 6.3); g.fill();
      g.fillStyle = '#f2a6c4'; g.beginPath(); g.arc(-34, -62, 14, 0, 6.3); g.arc(34, -62, 14, 0, 6.3); g.fill();
      g.fillStyle = '#a7a3c0'; g.beginPath(); g.arc(0, -64, 34, 0, 6.3); g.fill();
      g.beginPath(); g.moveTo(-12, -50); g.quadraticCurveTo(-18, -10, 6, -8); g.lineTo(14, -16);
      g.quadraticCurveTo(-4, -18, 2, -48); g.closePath(); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.moveTo(-22, -42); g.lineTo(-32, -22); g.lineTo(-16, -34); g.fill();
