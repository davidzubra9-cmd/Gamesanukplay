      g.fillStyle = '#222'; g.beginPath(); g.arc(-12, -74, 3.5, 0, 6.3); g.arc(12, -74, 3.5, 0, 6.3); g.fill();
      g.fillStyle = '#ffd21f'; SP.rr(g, -20, -102, 40, 12, 6); g.fill();
      if (q.st === 'stay' || q.st === 'up') {
        g.strokeStyle = 'rgba(120,210,255,0.8)'; g.lineWidth = 3;
        for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(10 + i * 8, -10 - i * 8 + Math.sin(t * 20 + i) * 2, 3, 0, 6.3); g.stroke(); }
      }
    } else {
      const monk = q.kind === 'monk', elder = q.kind === 'elder';
      // ลำตัว
      g.fillStyle = monk ? '#ff9a1f' : elder ? '#9575cd' : q.shirt;
      SP.rr(g, -34, -58, 68, 62, 16); g.fill();
      if (monk) {
        g.fillStyle = '#e07b00'; g.beginPath(); g.moveTo(-34, -40); g.lineTo(34, -8); g.lineTo(34, 4); g.lineTo(-34, 4); g.closePath(); g.fill();
      } else if (!elder) {
        g.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(-24 + (i % 3) * 22, -40 + Math.floor(i / 3) * 24, 5, 0, 6.3); g.fill(); }
      }
      // หัว
      g.fillStyle = q.skin; g.beginPath(); g.arc(0, -80, 26, 0, 6.3); g.fill();
      if (monk) {
        g.fillStyle = 'rgba(0,0,0,0.08)'; g.beginPath(); g.arc(0, -90, 20, Math.PI, 0); g.fill();
      } else if (elder) {
        g.fillStyle = '#e8e8ef'; g.beginPath(); g.arc(0, -86, 26, Math.PI * 1.05, Math.PI * 1.95); g.fill();
        g.beginPath(); g.arc(0, -108, 10, 0, 6.3); g.fill();
        g.strokeStyle = '#444'; g.lineWidth = 2;
        g.beginPath(); g.arc(-10, -80, 7, 0, 6.3); g.arc(10, -80, 7, 0, 6.3); g.moveTo(-3, -80); g.lineTo(3, -80); g.stroke();
      } else {
        g.fillStyle = '#2d1b4e'; g.beginPath(); g.arc(0, -84, 27, Math.PI * 1.02, Math.PI * 1.98); g.fill();
        // พวงมาลัย / ดอกไม้ทัดหู
        g.fillStyle = ['#ff6b9d', '#ffd21f', '#fff'][q.flower]; g.beginPath(); g.arc(20, -96, 6, 0, 6.3); g.fill();
      }
      // หน้าตา
      g.fillStyle = '#222';
      if (wet) {
        g.strokeStyle = '#222'; g.lineWidth = 2.5;
        g.beginPath(); g.arc(-10, -78, 5, Math.PI, 0); g.arc(10, -78, 5, Math.PI, 0); g.stroke();
      } else {
        g.beginPath(); g.arc(-10, -78, 3.2, 0, 6.3); g.arc(10, -78, 3.2, 0, 6.3); g.fill();
      }
      g.strokeStyle = '#8a2b2b'; g.lineWidth = 2.5; g.beginPath();
      if (monk || elder) g.arc(0, -68, 7, 0.2, Math.PI - 0.2); else g.arc(0, -70, 10, 0.1, Math.PI - 0.1);
      g.stroke();
    }
    if (wet) {
      g.fillStyle = 'rgba(80,180,255,0.35)';
      g.beginPath(); g.arc(0, -66, 46, 0, 6.3); g.fill();
      g.fillStyle = 'rgba(160,220,255,0.9)';
      for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(-24 + i * 12, -50 + ((t * 80 + i * 17) % 40), 3, 5, 0, 0, 6.3); g.fill(); }
    }
    g.restore();
  }

  function drawBarrel(h) {
    const x = h.x, y = h.y;
    g.fillStyle = '#1e6bff'; SP.rr(g, x - 66, y - 2, 132, 76, 14); g.fill();
    g.fillStyle = '#4d94ff'; SP.rr(g, x - 66, y - 2, 132, 14, 8); g.fill();
    g.fillStyle = '#1250c9'; g.fillRect(x - 66, y + 30, 132, 7); g.fillRect(x - 66, y + 56, 132, 7);
    g.fillStyle = 'rgba(255,255,255,0.28)'; SP.rr(g, x - 54, y + 14, 14, 52, 7); g.fill();
    g.fillStyle = '#ffd21f'; g.font = '700 15px Prompt, sans-serif'; g.textAlign = 'center';
    g.fillText('สงกรานต์', x + 8, y + 52);
  }

  function draw() {
    // ท้องฟ้าร้อนระอุ
    const sky = g.createLinearGradient(0, 0, 0, 230);
    sky.addColorStop(0, '#5b21b6'); sky.addColorStop(0.55, '#c2417b'); sky.addColorStop(1, '#ffb347');
    g.fillStyle = sky; g.fillRect(0, 0, W, 230);
    SP.glow(g, 690, 60, 150, 'rgba(255,240,150,0.9)', 0.9);
    g.fillStyle = '#fff2a8'; g.beginPath(); g.arc(690, 60, 34, 0, 6.3); g.fill();
    // เรือนไทยไกล ๆ
    g.fillStyle = '#2b0d57';
    [[90, 175], [330, 190], [560, 180]].forEach(p => {
      g.beginPath(); g.moveTo(p[0] - 80, p[1] + 55); g.lineTo(p[0] - 56, p[1] + 5); g.quadraticCurveTo(p[0] - 30, p[1] - 5, p[0], p[1] - 40);
      g.quadraticCurveTo(p[0] + 30, p[1] - 5, p[0] + 56, p[1] + 5); g.lineTo(p[0] + 80, p[1] + 55); g.closePath(); g.fill();
    });
    // ธงราว
    g.strokeStyle = '#fff'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(0, 20); g.quadraticCurveTo(W / 2, 70, W, 20); g.stroke();
    const cols = ['#ffd21f', '#fff', '#a78bfa', '#ff6b9d'];
    for (let i = 0; i < 18; i++) {
      const tt = (i + 0.5) / 18, x = W * tt, y = 20 + 2 * 25 * tt * (1 - tt) * 2 + 0;
      g.fillStyle = cols[i % 4]; g.beginPath(); g.moveTo(x - 9, y); g.lineTo(x + 9, y); g.lineTo(x, y + 22); g.closePath(); g.fill();
    }
    // พื้นถนน
    const gr = g.createLinearGradient(0, 230, 0, H);
    gr.addColorStop(0, '#4a1d96'); gr.addColorStop(1, '#2a0b55');
    g.fillStyle = gr; g.fillRect(0, 230, W, H - 230);
    g.fillStyle = 'rgba(255,210,31,0.18)';
    for (let i = 0; i < 12; i++) g.fillRect(i * 80 + 20, 232, 40, 4);

    // คนและถัง เรียงแถวหลังก่อนแถวหน้า
    [290, 440].forEach(row => {
      holes.filter(h => h.y === row).forEach(h => {
        SP.glow(g, h.x, h.y + 40, 90, 'rgba(0,0,0,0.35)', 0.5);
        if (h.p && h.p.rise > 0) drawPerson(h);
        drawBarrel(h);
      });
    });

    for (const d of drops) {
      g.globalAlpha = clamp(d.life * 2, 0, 1);
      g.fillStyle = '#9fe0ff'; g.beginPath(); g.arc(d.x, d.y, 4, 0, 6.3); g.fill();
    }
    g.globalAlpha = 1;
    g.font = '800 22px Prompt, sans-serif'; g.textAlign = 'center';
    for (const x of texts) {
      g.globalAlpha = clamp(x.life * 1.5, 0, 1);
      g.lineWidth = 4; g.strokeStyle = 'rgba(20,4,45,0.8)'; g.strokeText(x.s, x.x, x.y);
      g.fillStyle = x.c; g.fillText(x.s, x.x, x.y);
    }
    g.globalAlpha = 1;

    // แถบเวลา
    const pct = clamp(timeLeft / TOTAL, 0, 1);
    g.fillStyle = 'rgba(20,4,45,0.7)'; g.fillRect(0, 0, W, 12);
    g.fillStyle = pct < 0.25 ? '#ff5d5d' : '#ffd21f'; g.fillRect(0, 0, W * pct, 12);
    g.fillStyle = '#fff'; g.font = '700 16px Prompt, sans-serif'; g.textAlign = 'left';
    g.fillText('⏱ ' + Math.ceil(timeLeft) + ' วิ', 12, 36);
    if (combo >= 3) {
      g.textAlign = 'right'; g.fillStyle = '#ffe066'; g.font = '800 20px Prompt, sans-serif';
      g.fillText('คอมโบ x' + combo, W - 14, 36);
    }
    if (t < 3.5) {
      g.globalAlpha = clamp(3.5 - t, 0, 1);
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 230, 98, 460, 44, 14); g.fill();
      g.fillStyle = '#fff'; g.font = '600 18px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('แตะสาดเพื่อน ๆ — ห้ามสาดพระสงฆ์และผู้ใหญ่นะ 🙏', W / 2, 127);
      g.globalAlpha = 1;
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* ยานรบพิทักษ์ดวงดาว — ยิงอัตโนมัติ ลากเพื่อเคลื่อนที่ เก็บไอเท็ม โค่นบอส */
SP.register('star-defender', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;

  const P = { x: W / 2, y: H - 110, tx: W / 2 };
  let lives = 3, score = 0, t = 0, fireT = 0, inv = 0, rapid = 0, shield = 0, spawnT = 1, nextBoss = 50, shake = 0;
  const bullets = [], ebul = [], enemies = [], items = [], parts = [], stars = [], texts = [];
  let boss = null;
  const keys = {};
  for (let i = 0; i < 70; i++) stars.push({ x: R(0, W), y: R(0, H), s: R(0.5, 2.2), v: R(20, 120) });

  ctx.on(window, 'keydown', e => { keys[e.key] = true; });
  ctx.on(window, 'keyup', e => { keys[e.key] = false; });
  ctx.on(ctx.canvas, 'pointermove', e => { const p = ctx.pos(e); P.tx = p.x; });
  ctx.on(ctx.canvas, 'pointerdown', e => { const p = ctx.pos(e); P.tx = p.x; });

  function boom(x, y, c, n) {
    for (let i = 0; i < n; i++) {
      const a = R(0, 6.28), v = R(40, 220);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.3, 0.8), c });
    }
  }
  function say(x, y, s, c) { texts.push({ x, y, s, c, life: 0.9 }); }

  function spawnEnemy() {
    const r = Math.random(), x = R(40, W - 40);
    if (r < 0.55) enemies.push({ k: 'a', x, y: -30, hp: 1, r: 18, vy: R(70, 110) + t * 0.6, ph: R(0, 6), sc: 10, fire: R(1, 3) });
    else if (r < 0.85) enemies.push({ k: 'b', x, y: -30, hp: 3, r: 24, vy: R(50, 80) + t * 0.4, ph: R(0, 6), sc: 30, fire: R(0.8, 2) });
    else enemies.push({ k: 'c', x, y: -30, hp: 2, r: 20, vy: R(90, 130) + t * 0.5, ph: R(0, 6), sc: 20, fire: 99, tx: P.x });
  }

  function hurt() {
    if (inv > 0) return;
    if (shield > 0) { shield = 0; inv = 0.8; SP.sfx.hit(); boom(P.x, P.y, '#7cf3ff', 14); return; }
    lives--; inv = 1.8; shake = 0.3; SP.sfx.hit(); boom(P.x, P.y, '#ff8a3d', 22);
    if (lives <= 0) { SP.sfx.boom(); ctx.gameOver(score, 'ยานถูกทำลาย!'); }
  }

  function update(dt) {
    t += dt; ctx.setScore(score);
    if (inv > 0) inv -= dt; if (rapid > 0) rapid -= dt; if (shield > 0) shield -= dt; if (shake > 0) shake -= dt;
    const L = keys.ArrowLeft || keys.a || keys.A, Rr = keys.ArrowRight || keys.d || keys.D;
    if (L || Rr) P.tx += ((Rr ? 1 : 0) - (L ? 1 : 0)) * 560 * dt;
    P.tx = clamp(P.tx, 30, W - 30);
    P.x += (P.tx - P.x) * Math.min(1, dt * 12);

    for (const s of stars) { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = R(0, W); } }

    // ยิง
    fireT -= dt;
    if (fireT <= 0) {
      fireT = rapid > 0 ? 0.09 : 0.17;
      bullets.push({ x: P.x, y: P.y - 24, vx: 0 });
      if (rapid > 0) { bullets.push({ x: P.x - 14, y: P.y - 14, vx: -40 }); bullets.push({ x: P.x + 14, y: P.y - 14, vx: 40 }); }
      SP.sfx.shoot();
    }
    for (const b of bullets) { b.y -= 760 * dt; b.x += b.vx * dt; }
    for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].y < -20) bullets.splice(i, 1);

    // ศัตรู
    if (!boss) {
      spawnT -= dt;
      if (spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.35, 1.0 - t * 0.008) * R(0.7, 1.2); }
    }
    for (const e of enemies) {
      e.y += e.vy * dt; e.ph += dt * 2;
      if (e.k === 'a') e.x += Math.sin(e.ph) * 60 * dt;
      else if (e.k === 'c') e.x += clamp(P.x - e.x, -1, 1) * 90 * dt;
      e.fire -= dt;
      if (e.fire <= 0 && e.y > 20 && e.y < H * 0.6) {
        e.fire = R(1.4, 2.6);
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        ebul.push({ x: e.x, y: e.y + 10, vx: Math.cos(a) * 190, vy: Math.sin(a) * 190 });
      }
      if (Math.hypot(e.x - P.x, e.y - P.y) < e.r + 16) { e.hp = 0; boom(e.x, e.y, '#ffb74d', 12); hurt(); }
    }

    // บอส
    if (!boss && t >= nextBoss) {
      boss = { x: W / 2, y: -80, hp: 70, max: 70, dir: 1, fire: 1.2, ph: 0 };
      nextBoss += 55;
      say(W / 2, 200, 'บอสมาแล้ว!', '#ff8a8a');
    }
    if (boss) {
      boss.ph += dt;
      if (boss.y < 110) boss.y += 80 * dt;
      boss.x += boss.dir * 110 * dt;
      if (boss.x > W - 70) boss.dir = -1; if (boss.x < 70) boss.dir = 1;
      boss.fire -= dt;
      if (boss.fire <= 0 && boss.y >= 100) {
        boss.fire = 0.9;
        for (let i = -2; i <= 2; i++) ebul.push({ x: boss.x + i * 22, y: boss.y + 40, vx: i * 55, vy: 210 });
      }
      if (Math.hypot(boss.x - P.x, boss.y - P.y) < 60) hurt();
    }

    // กระสุนชนศัตรู
    for (const b of bullets) {
      if (b.dead) continue;
      for (const e of enemies) {
        if (e.hp > 0 && Math.abs(b.x - e.x) < e.r + 4 && Math.abs(b.y - e.y) < e.r + 8) {
          b.dead = true; e.hp--; boom(b.x, b.y, '#fff3a8', 3);
          if (e.hp <= 0) {
            score += e.sc; SP.sfx.boom(); boom(e.x, e.y, '#ff9f43', 14);
            if (Math.random() < 0.13) items.push({ k: Math.random() < 0.5 ? 'rapid' : 'shield', x: e.x, y: e.y });
          }
          break;
        }
      }
      if (!b.dead && boss && Math.abs(b.x - boss.x) < 56 && Math.abs(b.y - boss.y) < 40) {
        b.dead = true; boss.hp--; boom(b.x, b.y, '#ffd21f', 3);
        if (boss.hp <= 0) {
          score += 500; SP.sfx.boom(); boom(boss.x, boss.y, '#ffd21f', 50); say(boss.x, boss.y, 'ล้มบอส! +500', '#ffe066');
          items.push({ k: 'shield', x: boss.x, y: boss.y }); boss = null;
          if (lives < 3) lives++;
        }
      }
    }
    for (let i = bullets.length - 1; i >= 0; i--) if (bullets[i].dead) bullets.splice(i, 1);
    for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].hp <= 0 || enemies[i].y > H + 40) enemies.splice(i, 1);

    // กระสุนศัตรู
    for (const b of ebul) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.hypot(b.x - P.x, b.y - P.y) < 15) { b.dead = true; hurt(); }
    }
    for (let i = ebul.length - 1; i >= 0; i--) if (ebul[i].dead || ebul[i].y > H + 20 || ebul[i].x < -20 || ebul[i].x > W + 20) ebul.splice(i, 1);

    // ไอเท็ม
    for (const it of items) {
      it.y += 110 * dt;
      if (Math.hypot(it.x - P.x, it.y - P.y) < 30) {
        it.dead = true; SP.sfx.coin();
        if (it.k === 'rapid') { rapid = 8; say(P.x, P.y - 40, 'ยิงเร็ว!', '#ffe066'); }
        else { shield = 10; say(P.x, P.y - 40, 'โล่!', '#7cf3ff'); }
      }
    }
    for (let i = items.length - 1; i >= 0; i--) if (items[i].dead || items[i].y > H + 20) items.splice(i, 1);

    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
    for (const x of texts) { x.y -= 36 * dt; x.life -= dt; }
    for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
  }

  function drawShip(x, y) {
    g.save(); g.translate(x, y);
    const fl = 10 + Math.sin(t * 40) * 4;
    g.fillStyle = '#ffb300'; g.beginPath(); g.moveTo(-8, 16); g.lineTo(0, 16 + fl + 8); g.lineTo(8, 16); g.fill();
    g.fillStyle = '#fff3a8'; g.beginPath(); g.moveTo(-4, 16); g.lineTo(0, 16 + fl); g.lineTo(4, 16); g.fill();
    g.fillStyle = '#6d28d9';
    g.beginPath(); g.moveTo(0, -28); g.lineTo(26, 18); g.lineTo(10, 12); g.lineTo(0, 20); g.lineTo(-10, 12); g.lineTo(-26, 18); g.closePath(); g.fill();
    g.fillStyle = '#ffd21f'; g.beginPath(); g.moveTo(0, -28); g.lineTo(8, 4); g.lineTo(0, 10); g.lineTo(-8, 4); g.closePath(); g.fill();
    g.fillStyle = '#a78bfa'; g.beginPath(); g.ellipse(0, -2, 4, 8, 0, 0, 6.3); g.fill();
    g.strokeStyle = '#ffd21f'; g.lineWidth = 2; g.beginPath(); g.moveTo(-26, 18); g.lineTo(-10, 12); g.moveTo(26, 18); g.lineTo(10, 12); g.stroke();
    if (shield > 0) {
      g.strokeStyle = 'rgba(124,243,255,' + (0.5 + Math.sin(t * 10) * 0.2) + ')'; g.lineWidth = 3;
      g.beginPath(); g.arc(0, 0, 36, 0, 6.3); g.stroke();
      g.fillStyle = 'rgba(124,243,255,0.12)'; g.fill();
    }
    g.restore();
  }

  function drawEnemy(e) {
    g.save(); g.translate(e.x, e.y);
    if (e.k === 'a') {
      g.fillStyle = '#ff5d8f'; g.beginPath(); g.moveTo(0, 18); g.lineTo(18, -10); g.lineTo(0, -4); g.lineTo(-18, -10); g.closePath(); g.fill();
      g.fillStyle = '#ffd21f'; g.beginPath(); g.arc(0, 0, 5, 0, 6.3); g.fill();
    } else if (e.k === 'b') {
      g.fillStyle = '#8b5cf6'; g.beginPath(); g.ellipse(0, 4, 26, 12, 0, 0, 6.3); g.fill();
      g.fillStyle = '#c4b5fd'; g.beginPath(); g.ellipse(0, -4, 14, 12, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#ffd21f'; for (let i = -1; i <= 1; i++) { g.beginPath(); g.arc(i * 14, 6, 3, 0, 6.3); g.fill(); }
      if (e.hp < 3) { g.fillStyle = 'rgba(255,255,255,0.4)'; g.fillRect(-26, 20, 52 * e.hp / 3, 3); }
    } else {
      g.rotate(t * 4);
      SP.starPath(g, 0, 0, 20, 9, 4, 0); g.fillStyle = '#ff9f43'; g.fill(); g.strokeStyle = '#7c2d12'; g.lineWidth = 2; g.stroke();
    }
    g.restore();
  }

  function draw() {
    g.save();
    if (shake > 0) g.translate(R(-5, 5), R(-5, 5));
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0220'); bg.addColorStop(1, '#2b0d5e');
    g.fillStyle = bg; g.fillRect(-10, -10, W + 20, H + 20);
    for (const s of stars) { g.fillStyle = 'rgba(255,255,255,' + clamp(s.s / 2.2, 0.2, 0.9) + ')'; g.fillRect(s.x, s.y, s.s, s.s * (1 + s.v / 60)); }
    SP.glow(g, W * 0.8, 120, 160, 'rgba(168,85,247,0.35)', 1);

    for (const it of items) {
      SP.glow(g, it.x, it.y, 28, it.k === 'rapid' ? 'rgba(255,210,31,0.8)' : 'rgba(124,243,255,0.8)', 0.9);
      g.fillStyle = it.k === 'rapid' ? '#ffd21f' : '#7cf3ff';
      SP.rr(g, it.x - 13, it.y - 13, 26, 26, 8); g.fill();
      g.fillStyle = '#2a0b55'; g.font = '800 16px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText(it.k === 'rapid' ? '⚡' : '🛡', it.x, it.y + 6);
    }
    for (const e of enemies) drawEnemy(e);
    if (boss) {
      g.save(); g.translate(boss.x, boss.y);
      g.fillStyle = '#4c1d95'; g.beginPath(); g.ellipse(0, 0, 64, 30, 0, 0, 6.3); g.fill();
      g.fillStyle = '#7c3aed'; g.beginPath(); g.ellipse(0, -10, 40, 24, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#ffd21f'; for (let i = -3; i <= 3; i++) { g.beginPath(); g.arc(i * 16, 8, 4, 0, 6.3); g.fill(); }
      g.fillStyle = '#ff4d4d'; g.beginPath(); g.arc(0, -14, 9, 0, 6.3); g.fill();
      g.restore();
      g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(W / 2 - 100, 46, 200, 8);
      g.fillStyle = '#ff5d5d'; g.fillRect(W / 2 - 100, 46, 200 * boss.hp / boss.max, 8);
    }
    for (const b of bullets) { g.fillStyle = '#ffe066'; SP.rr(g, b.x - 2.5, b.y - 9, 5, 16, 2); g.fill(); }
    for (const b of ebul) {
      SP.glow(g, b.x, b.y, 12, 'rgba(255,90,140,0.8)', 0.9);
      g.fillStyle = '#ff5d8f'; g.beginPath(); g.arc(b.x, b.y, 5, 0, 6.3); g.fill();
    }
    if (!(inv > 0 && Math.floor(t * 12) % 2)) drawShip(P.x, P.y);
    for (const p of parts) { g.globalAlpha = clamp(p.life * 2.5, 0, 1); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 3, 0, 6.3); g.fill(); }
    g.globalAlpha = 1;
    g.font = '800 20px Prompt, sans-serif'; g.textAlign = 'center';
    for (const x of texts) {
      g.globalAlpha = clamp(x.life * 1.5, 0, 1);
      g.lineWidth = 4; g.strokeStyle = 'rgba(20,4,45,0.8)'; g.strokeText(x.s, x.x, x.y);
      g.fillStyle = x.c; g.fillText(x.s, x.x, x.y);
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 3; i++) {
      SP.heartPath(g, 26 + i * 30, 14, 22);
      g.fillStyle = i < lives ? '#ff4d8d' : 'rgba(255,255,255,0.2)'; g.fill();
    }
    if (rapid > 0) { g.fillStyle = '#ffd21f'; g.font = '700 14px Prompt, sans-serif'; g.textAlign = 'right'; g.fillText('⚡ ' + Math.ceil(rapid), W - 14, 28); }
    if (shield > 0) { g.fillStyle = '#7cf3ff'; g.font = '700 14px Prompt, sans-serif'; g.textAlign = 'right'; g.fillText('🛡 ' + Math.ceil(shield), W - 14, 48); }
    if (t < 3.5) {
      g.globalAlpha = clamp(3.5 - t, 0, 1);
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 170, H / 2 - 40, 340, 50, 14); g.fill();
      g.fillStyle = '#fff'; g.font = '600 18px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('ลากเพื่อเคลื่อนยาน — ยิงอัตโนมัติ', W / 2, H / 2 - 9);
      g.globalAlpha = 1;
    }
    g.restore();
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* ตะกร้อลอยฟ้า — แตะเตะลูกตะกร้อให้ลอยนานที่สุด และเตะลอดห่วงรับโบนัส */
SP.register('takraw-keepy', function (ctx) {
  const W = ctx.w, H = ctx.h, g = ctx.g;
  const R = SP.rand, clamp = SP.clamp;
  const FLOOR = H - 62, BR = 31;

  const ball = { x: W / 2, y: 150, vx: 0, vy: 0, rot: 0 };
  const hoop = { x: W / 2, y: 105, w: 96 };
  let kicks = 0, score = 0, t = 0, cd = 0, hoopCd = 0, started = false;
  const sparks = [], texts = [], feet = [];

  function say(x, y, s, c) { texts.push({ x, y, s, c, life: 1 }); }

  ctx.on(ctx.canvas, 'pointerdown', e => {
    if (cd > 0) return;
    const p = ctx.pos(e);
    const dx = p.x - ball.x, dy = p.y - ball.y;
    if (Math.hypot(dx, dy) > BR + 38) return;
    const s = clamp((dy / BR + 1) / 2, 0, 1);            // แตะล่าง = เตะแรง
    ball.vy = -(540 + 400 * s);
    ball.vx = clamp(-dx * 6 + R(-25, 25), -300, 300);   // แตะซ้าย = ลูกไปขวา
    cd = 0.07; kicks++; score++; started = true;
    ctx.setScore(score);
    SP.tone(260 + s * 160, 0.1, 'triangle', 0.15, 120);
    SP.noise(0.04, 0.05);
    feet.push({ x: ball.x, y: ball.y + BR, life: 0.18 });
    for (let i = 0; i < 8; i++) {
      const a = R(0, 6.28), v = R(60, 180);
      sparks.push({ x: ball.x, y: ball.y + BR * 0.6, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.25, 0.5) });
    }
    if (kicks % 10 === 0) { say(ball.x, ball.y - 50, kicks + ' ครั้ง!', '#ffe066'); SP.sfx.coin(); }
  });

  function update(dt) {
    t += dt; if (cd > 0) cd -= dt; if (hoopCd > 0) hoopCd -= dt;
    const gravity = 1100 + Math.min(500, kicks * 8);
    // ห่วงเคลื่อนที่
    const amp = Math.min(280, 40 + kicks * 6);
    hoop.x = W / 2 + Math.sin(t * 0.9) * amp;
    hoop.y = 105 + Math.sin(t * 1.7) * 18;

    if (started) {
      const py = ball.y;
      ball.vy += gravity * dt;
      ball.x += ball.vx * dt; ball.y += ball.vy * dt;
      ball.vx *= (1 - 0.15 * dt);
      ball.rot += ball.vx * dt * 0.012 + dt * 1.5;
      if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) * 0.8; }
      if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.8; }
      if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy) * 0.4; }
      // ลอดห่วง
      if (hoopCd <= 0 && Math.abs(ball.x - hoop.x) < hoop.w / 2 - 8 &&
          ((py > hoop.y && ball.y <= hoop.y) || (py < hoop.y && ball.y >= hoop.y))) {
        hoopCd = 0.6; score += 5; ctx.setScore(score); SP.sfx.coin();
        say(hoop.x, hoop.y + 30, 'ลอดห่วง! +5', '#7cf3ff');
        for (let i = 0; i < 16; i++) {
          const a = R(0, 6.28), v = R(80, 220);
          sparks.push({ x: hoop.x, y: hoop.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: R(0.4, 0.8) });
        }
      }
      if (ball.y >= FLOOR - BR) { SP.sfx.hit(); ctx.gameOver(score, 'ลูกตะกร้อตกพื้น!'); return; }
    }
    for (const s of sparks) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; s.life -= dt; }
    for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
    for (const x of texts) { x.y -= 38 * dt; x.life -= dt; }
    for (let i = texts.length - 1; i >= 0; i--) if (texts[i].life <= 0) texts.splice(i, 1);
    for (const f of feet) f.life -= dt;
    for (let i = feet.length - 1; i >= 0; i--) if (feet[i].life <= 0) feet.splice(i, 1);
  }

  function drawBall() {
    // เงา
    const h = clamp((FLOOR - ball.y) / FLOOR, 0, 1);
    g.fillStyle = 'rgba(0,0,0,' + (0.35 - h * 0.2) + ')';
    g.beginPath(); g.ellipse(ball.x, FLOOR + 6, BR * (1.1 - h * 0.5), 8 * (1.1 - h * 0.5), 0, 0, 6.3); g.fill();
    g.save(); g.translate(ball.x, ball.y); g.rotate(ball.rot);
    const gr = g.createRadialGradient(-8, -10, 4, 0, 0, BR);
    gr.addColorStop(0, '#ffe28a'); gr.addColorStop(1, '#d9962b');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, BR, 0, 6.3); g.fill();
    g.strokeStyle = '#7a4a10'; g.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.ellipse(0, 0, BR - 1, BR * 0.42, i * Math.PI / 3, 0, 6.3); g.stroke();
    }
    g.beginPath(); g.arc(0, 0, BR - 1, 0, 6.3); g.stroke();
    g.restore();
  }

  function draw() {
    // ท้องฟ้าเย็น ๆ
    const sky = g.createLinearGradient(0, 0, 0, FLOOR);
    sky.addColorStop(0, '#4c1d95'); sky.addColorStop(0.6, '#a855a8'); sky.addColorStop(1, '#fbbf24');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    SP.glow(g, 120, 330, 220, 'rgba(255,220,100,0.55)', 1);
    // วัดไกล ๆ
    g.fillStyle = '#3a1280';
    [[610, 0.9], [740, 0.7], [160, 0.75]].forEach(p => {
      const x = p[0], s = p[1];
      g.beginPath(); g.moveTo(x - 50 * s, FLOOR); g.lineTo(x - 40 * s, FLOOR - 70 * s); g.lineTo(x, FLOOR - 170 * s);
      g.lineTo(x + 40 * s, FLOOR - 70 * s); g.lineTo(x + 50 * s, FLOOR); g.closePath(); g.fill();
      g.fillRect(x - 3, FLOOR - 205 * s, 6, 40 * s);
    });
    // พื้นลานดิน
    const fl = g.createLinearGradient(0, FLOOR, 0, H);
    fl.addColorStop(0, '#8b5a14'); fl.addColorStop(1, '#4a2e07');
    g.fillStyle = fl; g.fillRect(0, FLOOR, W, H - FLOOR);
    g.fillStyle = '#ffd21f'; g.fillRect(0, FLOOR, W, 5);

    // ห่วง
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(hoop.x - hoop.w / 2, hoop.y); g.lineTo(hoop.x - hoop.w / 2 - 6, 0); g.moveTo(hoop.x + hoop.w / 2, hoop.y); g.lineTo(hoop.x + hoop.w / 2 + 6, 0); g.stroke();
    g.strokeStyle = '#ffd21f'; g.lineWidth = 7;
    g.beginPath(); g.ellipse(hoop.x, hoop.y, hoop.w / 2, 15, 0, 0, 6.3); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(hoop.x, hoop.y, hoop.w / 2 - 6, 11, 0, 0, 6.3); g.stroke();
    SP.glow(g, hoop.x, hoop.y, 70, 'rgba(255,210,31,0.4)', hoopCd > 0 ? 1 : 0.6);

    // นับครั้งใหญ่จาง ๆ
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.font = '800 150px Prompt, sans-serif'; g.textAlign = 'center';
    g.fillText(String(kicks), W / 2, 330);

    drawBall();
    // เท้าเตะ
    for (const f of feet) {
      g.save(); g.globalAlpha = clamp(f.life / 0.18, 0, 1);
      g.fillStyle = '#f1c27d'; SP.rr(g, f.x - 22, f.y - 4, 44, 20, 10); g.fill();
      g.fillStyle = '#7c3aed'; SP.rr(g, f.x - 22, f.y + 10, 44, 10, 5); g.fill();
      g.restore();
    }
    for (const s of sparks) { g.globalAlpha = clamp(s.life * 3, 0, 1); g.fillStyle = '#ffe066'; g.beginPath(); g.arc(s.x, s.y, 3, 0, 6.3); g.fill(); }
    g.globalAlpha = 1;
    g.font = '800 22px Prompt, sans-serif'; g.textAlign = 'center';
    for (const x of texts) {
      g.globalAlpha = clamp(x.life * 1.5, 0, 1);
      g.lineWidth = 4; g.strokeStyle = 'rgba(20,4,45,0.8)'; g.strokeText(x.s, x.x, x.y);
      g.fillStyle = x.c; g.fillText(x.s, x.x, x.y);
    }
    g.globalAlpha = 1;
    if (!started) {
      g.fillStyle = 'rgba(20,4,45,0.75)'; SP.rr(g, W / 2 - 210, 250, 420, 70, 16); g.fill();
      g.fillStyle = '#fff'; g.font = '700 20px Prompt, sans-serif'; g.textAlign = 'center';
      g.fillText('แตะลูกตะกร้อเพื่อเริ่มเตะ', W / 2, 280);
      g.fillStyle = '#ffd21f'; g.font = '500 15px Prompt, sans-serif';
      g.fillText('แตะล่างลูก = เตะแรง · แตะข้างลูก = เปลี่ยนทิศ', W / 2, 303);
    }
  }

  ctx.loop(dt => { update(dt); draw(); });
});

/* จับคู่ไทยแท้ — เกมจับคู่การ์ดของดีเมืองไทย (DOM) */
SP.register('thai-memory', function (ctx) {
  const ITEMS = [
    ['🐘', 'ช้างไทย'], ['🥭', 'มะม่วง'], ['🍜', 'ก๋วยเตี๋ยว'], ['🌶️', 'พริก'],
    ['🥥', 'มะพร้าว'], ['🍍', 'สับปะรด'], ['🛺', 'ตุ๊กตุ๊ก'], ['🙏', 'สวัสดี'],
    ['🪁', 'ว่าว'], ['🥁', 'กลองไทย'], ['🍚', 'ข้าวเหนียว'], ['🦐', 'กุ้งแม่น้ำ'],
    ['🍗', 'ไก่ย่าง'], ['🍌', 'กล้วย'], ['🌺', 'ดอกไม้'], ['💦', 'สงกรานต์']
  ];
  const LEVELS = [{ pairs: 6, cols: 3, time: 50 }, { pairs: 8, cols: 4, time: 65 }, { pairs: 10, cols: 4, time: 80 }, { pairs: 12, cols: 4, time: 90 }];

  let level = 0, score = 0, time = 0, moves = 0, combo = 0;
  let first = null, lock = false, left = 0, ended = false;

  const root = ctx.root;
  root.innerHTML =
    '<div class="mem"><div class="mem-top"><span>ด่าน <b data-lv>1</b></span><span>⏱ <b data-tm>0</b></span><span>เปิด <b data-mv>0</b></span></div>' +
    '<div class="mem-grid"></div><div class="mem-msg"></div></div>';
  const grid = root.querySelector('.mem-grid');
  const msg = root.querySelector('.mem-msg');
  const lvEl = root.querySelector('[data-lv]'), tmEl = root.querySelector('[data-tm]'), mvEl = root.querySelector('[data-mv]');

  function toast(text, ms) {
    msg.textContent = text; msg.classList.add('show');
    ctx.after(() => msg.classList.remove('show'), ms || 1000);
  }

  function setup() {
    const L = LEVELS[Math.min(level, LEVELS.length - 1)];
    const extra = Math.max(0, level - (LEVELS.length - 1));
    time = Math.max(55, L.time - extra * 5);
    moves = 0; combo = 0; first = null; lock = false; left = L.pairs;
    lvEl.textContent = String(level + 1); mvEl.textContent = '0'; tmEl.textContent = String(Math.ceil(time));
    const picks = SP.shuffle(ITEMS.slice()).slice(0, L.pairs);
    const cards = SP.shuffle(picks.concat(picks));
    const rows = Math.ceil(cards.length / L.cols);
    grid.style.gridTemplateColumns = 'repeat(' + L.cols + ',1fr)';
    grid.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';
    grid.innerHTML = '';
    cards.forEach(c => {
      const d = document.createElement('div');
      d.className = 'mem-card';
      d.dataset.k = c[0];
      d.innerHTML = '<div class="mem-in"><div class="mem-face mem-front">✦</div>' +
        '<div class="mem-face mem-back"><span class="e">' + c[0] + '</span><span class="t">' + c[1] + '</span></div></div>';
      grid.appendChild(d);
    });
  }

  ctx.on(grid, 'pointerdown', e => {
    const card = e.target.closest('.mem-card');
    if (!card || lock || ended) return;
    if (card.classList.contains('flip') || card.classList.contains('done')) return;
    card.classList.add('flip'); SP.sfx.flip();
    if (!first) { first = card; return; }
    moves++; mvEl.textContent = String(moves);
    const a = first, b = card; first = null;
    if (a.dataset.k === b.dataset.k) {
      combo++;
      a.classList.remove('flip'); b.classList.remove('flip'); a.classList.add('done'); b.classList.add('done');
      score += 100 * (level + 1) + (combo - 1) * 25;
      ctx.setScore(score); SP.sfx.coin();
      if (combo >= 2) toast('คอมโบ x' + combo + '!', 700);
      left--;
      if (left === 0) {
        const bonus = Math.ceil(time) * 10;
        score += bonus; ctx.setScore(score); SP.sfx.win();
        toast('ผ่านด่าน! โบนัสเวลา +' + bonus, 1500);
        lock = true;
        ctx.after(() => { level++; setup(); }, 1700);
      }
    } else {
      combo = 0; lock = true;
      ctx.after(() => { a.classList.remove('flip'); b.classList.remove('flip'); lock = false; }, 700);
    }
  });

  ctx.every(() => {
    if (ended || lock && left === 0) return;
    time -= 0.1;
    tmEl.textContent = String(Math.max(0, Math.ceil(time)));
    if (time <= 0) { ended = true; ctx.gameOver(score, 'หมดเวลา! ถึงด่าน ' + (level + 1)); }
  }, 100);

  ctx.setScore(0);
  setup();
});

/* OX ท้าบอท — เล่นสู้บอท 5 รอบ เลือกระดับง่ายหรือยาก (DOM) */
SP.register('tic-tac-toe', function (ctx) {
  const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  const ROUNDS = 5;
  const root = ctx.root;
  let hard = false, round = 1, score = 0, wins = 0, losses = 0, draws = 0;
  let b = Array(9).fill(''), turnLock = false, ended = false;

  function winnerOf(bd) {
    for (const l of LINES) if (bd[l[0]] && bd[l[0]] === bd[l[1]] && bd[l[0]] === bd[l[2]]) return { w: bd[l[0]], line: l };
    return null;
  }
  function minimax(bd, turn, depth) {
    const w = winnerOf(bd);
    if (w) return w.w === 'O' ? 10 - depth : depth - 10;
    if (bd.every(Boolean)) return 0;
    let best = turn === 'O' ? -99 : 99;
    for (let i = 0; i < 9; i++) if (!bd[i]) {
      bd[i] = turn;
      const v = minimax(bd, turn === 'O' ? 'X' : 'O', depth + 1);
      bd[i] = '';
      best = turn === 'O' ? Math.max(best, v) : Math.min(best, v);
    }
    return best;
  }
  function botMove() {
    const empty = []; for (let i = 0; i < 9; i++) if (!b[i]) empty.push(i);
    if (!hard) {
      // ระดับง่าย: ชนะถ้าเห็นทางชนะ ไม่งั้นสุ่ม (ไม่บล็อกเสมอไป)
      for (const i of empty) { b[i] = 'O'; if (winnerOf(b)) { b[i] = ''; return i; } b[i] = ''; }
      if (Math.random() < 0.35) for (const i of empty) { b[i] = 'X'; if (winnerOf(b)) { b[i] = ''; return i; } b[i] = ''; }
      return SP.pick(empty);
    }
    let bestV = -99, moves = [];
    for (const i of empty) {
      b[i] = 'O'; const v = minimax(b, 'X', 1); b[i] = '';
      if (v > bestV) { bestV = v; moves = [i]; } else if (v === bestV) moves.push(i);
    }
    return SP.pick(moves);
  }

  function renderPick() {
    root.innerHTML = '<div class="ox"><h2 style="font-size:2em;font-weight:800;color:#ffd21f">OX ท้าบอท</h2>' +
      '<p style="color:#eadfff">เล่นสู้บอท ' + ROUNDS + ' รอบ เลือกระดับความยาก</p>' +
      '<div class="ox-pick"><button class="btn" data-lv="0">🙂 ง่าย</button><button class="btn ghost" data-lv="1">😈 ยาก</button></div></div>';
    root.querySelectorAll('[data-lv]').forEach(btn => btn.onclick = () => { hard = btn.dataset.lv === '1'; SP.sfx.click(); startRound(); });
  }

  function renderBoard(winLine) {
    root.innerHTML =
      '<div class="ox"><div class="ox-top"><span>รอบ <b>' + round + '/' + ROUNDS + '</b></span><span>ชนะ <b>' + wins + '</b></span><span>เสมอ <b>' + draws + '</b></span><span>แพ้ <b>' + losses + '</b></span></div>' +
      '<div class="ox-status" data-st></div><div class="ox-board"></div>' +
      '<div style="color:#b9a6e6;font-size:.85em">คุณคือ <b style="color:#ffd21f">X</b> · บอท (' + (hard ? 'ยาก' : 'ง่าย') + ') คือ <b style="color:#c4a1ff">O</b></div></div>';
    const bd = root.querySelector('.ox-board');
    b.forEach((v, i) => {
      const c = document.createElement('button');
      c.className = 'ox-cell' + (v ? ' ' + v.toLowerCase() : '') + (winLine && winLine.indexOf(i) >= 0 ? ' win' : '');
      c.textContent = v; c.disabled = !!v || turnLock || ended;
      c.onclick = () => play(i);
      bd.appendChild(c);
    });
  }
  function status(t) { const s = root.querySelector('[data-st]'); if (s) s.textContent = t; }

  function startRound() {
    b = Array(9).fill(''); turnLock = false;
    renderBoard(); status('ตาคุณ — วาง X');
    // สลับคนเริ่ม: รอบคู่บอทเริ่มก่อน
    if (round % 2 === 0) {
      turnLock = true; status('บอทกำลังคิด...');
      ctx.after(() => { const m = botMove(); b[m] = 'O'; SP.sfx.pop(); turnLock = false; renderBoard(); status('ตาคุณ — วาง X'); }, 600);
    }
  }

  function finish(res, line) {
    turnLock = true;
    if (res === 'X') { wins++; score += Math.round(20 * (hard ? 1.5 : 1)); SP.sfx.win(); }
    else if (res === 'O') { losses++; SP.sfx.hit(); }
    else { draws++; score += Math.round(8 * (hard ? 1.5 : 1)); SP.sfx.click(); }
    ctx.setScore(score);
    renderBoard(line);
    status(res === 'X' ? '🎉 คุณชนะรอบนี้!' : res === 'O' ? '😵 บอทชนะรอบนี้' : '🤝 เสมอกัน');
    if (round >= ROUNDS) {
      ended = true;
      ctx.after(() => ctx.gameOver(score, wins > losses ? 'ชนะบอทได้!' : wins === losses ? 'เสมอกับบอท' : 'บอทชนะ ลองใหม่นะ'), 1200);
    } else {
      ctx.after(() => { round++; startRound(); }, 1300);
    }
  }

  function play(i) {
    if (turnLock || ended || b[i]) return;
    b[i] = 'X'; SP.sfx.click();
    let w = winnerOf(b);
    if (w) return finish('X', w.line);
    if (b.every(Boolean)) return finish('draw');
    turnLock = true; renderBoard(); status('บอทกำลังคิด...');
    ctx.after(() => {
      const m = botMove(); b[m] = 'O'; SP.sfx.pop();
      w = winnerOf(b);
      if (w) return finish('O', w.line);
      if (b.every(Boolean)) return finish('draw');
      turnLock = false; renderBoard(); status('ตาคุณ — วาง X');
    }, 500);
  }

  ctx.setScore(0);
  renderPick();
});

;
/* =========================================================
   ตัวเล่นเกม: สร้างเวที หน้าเริ่มเกม หน้าจบเกม ปุ่มควบคุม
   เกมแต่ละเกมลงทะเบียนด้วย SP.register(id, function (ctx) { ... })
   ctx = { root, canvas, g, w, h, setScore, gameOver, on, loop, after, every, pos, best }
   ========================================================= */
(function () {
  'use strict';
  var SP = window.SP;
  var BLOCK_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, ' ': 1, Spacebar: 1 };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function loadScript(src, ok, fail) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = fail;
    document.head.appendChild(s);
  }

  SP.mountPlayer = function (mount, meta, hooks) {
    hooks = hooks || {};
    mount.innerHTML = '';

    var wrap = el('section', 'stage-wrap');
    var box = el('div', 'stage-box');
    var root = el('div', 'stage-root' + (meta.type === 'dom' ? ' dom' : ''));
    var ov = el('div', 'overlay');
    box.appendChild(root);
    box.appendChild(ov);

    var bar = el('div', 'stagebar');
    bar.innerHTML =
      '<div class="hud"><span>คะแนน <b data-sc>0</b></span><span>สูงสุด <b data-bs>0</b></span></div>' +
      '<div class="btns">' +
      '<button class="ibtn" data-act="restart" title="เริ่มใหม่" aria-label="เริ่มใหม่">↻</button>' +
      '<button class="ibtn" data-act="mute" title="เปิด/ปิดเสียง" aria-label="เปิดปิดเสียง"></button>' +
      '<button class="ibtn" data-act="full" title="เต็มจอ" aria-label="เต็มจอ">⛶</button>' +
      '</div>';
    wrap.appendChild(box);
    wrap.appendChild(bar);
    mount.appendChild(wrap);

    var scEl = bar.querySelector('[data-sc]');
    var bsEl = bar.querySelector('[data-bs]');
    var muteBtn = bar.querySelector('[data-act="mute"]');

    var session = null;       // เกมที่กำลังเล่น
    var destroyed = false;

    function refreshMute() { muteBtn.textContent = SP.isMuted() ? '🔇' : '🔊'; }
    refreshMute();
    bsEl.textContent = SP.fmt(SP.getBest(meta.id));

    /* ---------- ปรับขนาดเวทีให้พอดีหน้าจอ ---------- */
    function isFull() {
      return document.fullscreenElement === wrap || document.webkitFullscreenElement === wrap;
    }
    function fit() {
      if (destroyed) return;
      var ratio = meta.w / meta.h;
      var full = isFull();
      var wrapW = full ? window.innerWidth : wrap.clientWidth - 24;
      var barH = bar.offsetHeight + 12;
      var maxH = full ? window.innerHeight - barH - 16 : Math.max(320, window.innerHeight - 200 - barH);
      var w = Math.min(wrapW, maxH * ratio);
      if (meta.type === 'dom') w = Math.min(w, 560);
      var h = w / ratio;
      box.style.width = Math.floor(w) + 'px';
      box.style.height = Math.floor(h) + 'px';
      var fs = meta.type === 'dom' ? w / 30 : SP.clamp(w / 30, 11, 20);
      box.style.fontSize = fs.toFixed(2) + 'px';
    }
    fit();
    var onResize = function () { fit(); };
    window.addEventListener('resize', onResize);
    document.addEventListener('fullscreenchange', onResize);
    document.addEventListener('webkitfullscreenchange', onResize);

    var onKeyBlock = function (e) {
      if (!session || !session.running) return;
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA') return;
      if (BLOCK_KEYS[e.key]) e.preventDefault();
    };
    window.addEventListener('keydown', onKeyBlock);

    /* ---------- หน้าจอซ้อน (overlay) ---------- */
    function showIntro() {
      ov.className = 'overlay';
      var how = (meta.how || []).map(function (h) { return '<li>' + h + '</li>'; }).join('');
      ov.innerHTML =
        '<div class="ov-icon">' + meta.icon + '</div>' +
        '<h2>' + meta.title + '</h2>' +
        '<ul class="ov-how">' + how + '</ul>' +
        '<button class="btn big" data-go>▶ เริ่มเล่น</button>' +
        '<div class="ov-ctrl">' + SP.inputLabel(meta) + '</div>';
      ov.querySelector('[data-go]').onclick = function () { start(); };
    }

    function showError(msg) {
      ov.className = 'overlay';
      ov.innerHTML = '<div class="ov-icon">😵</div><h2>โหลดเกมไม่สำเร็จ</h2><p class="ov-sub">' + msg + '</p>' +
        '<div class="ov-btns"><button class="btn" data-home>กลับหน้าแรก</button></div>';
      ov.querySelector('[data-home]').onclick = function () { if (hooks.onHome) hooks.onHome(); };
    }

    function showOver(score, msg, isNew) {
      ov.className = 'overlay';
      ov.innerHTML =
        '<h2>' + (msg || 'จบเกม') + '</h2>' +
        '<div class="ov-sub">คะแนนของคุณ</div>' +
        '<div class="ov-score">' + SP.fmt(score) + '</div>' +
        (isNew ? '<div class="ov-new">🏆 สถิติใหม่!</div>' : '<div class="ov-sub">สูงสุด ' + SP.fmt(SP.getBest(meta.id)) + '</div>') +
        '<div class="ov-btns"><button class="btn" data-again>↻ เล่นอีกครั้ง</button>' +
        '<button class="btn ghost" data-home>หน้าแรก</button></div>';
      ov.querySelector('[data-again]').onclick = function () { start(); };
      ov.querySelector('[data-home]').onclick = function () { if (hooks.onHome) hooks.onHome(); };
    }

    /* ---------- เริ่ม / หยุดเกม ---------- */
    function stop() {
      if (!session) return;
      var s = session;
      session = null;
      s.running = false;
      s.cleanups.forEach(function (fn) { try { fn(); } catch (e) {} });
      if (s.api && typeof s.api.destroy === 'function') { try { s.api.destroy(); } catch (e) {} }
      root.innerHTML = '';
    }

    function start() {
      stop();
      SP.unlockAudio();
      SP.pushRecent(meta.id);
      ov.className = 'overlay hide';
      scEl.textContent = '0';
      bsEl.textContent = SP.fmt(SP.getBest(meta.id));

      var S = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      var s = { running: true, cleanups: [], over: false, api: null };
      session = s;

      var canvas = null, g = null;
      if (meta.type === 'canvas') {
        canvas = document.createElement('canvas');
        canvas.width = Math.round(meta.w * S);
        canvas.height = Math.round(meta.h * S);
        root.appendChild(canvas);
        g = canvas.getContext('2d');
      }

      var ctx = {
        root: root, canvas: canvas, g: g, w: meta.w, h: meta.h, S: S,
        best: SP.getBest(meta.id),
        setScore: function (n) { scEl.textContent = SP.fmt(n); },
        pos: function (e) {
          var r = (canvas || root).getBoundingClientRect();
          return { x: (e.clientX - r.left) / r.width * meta.w, y: (e.clientY - r.top) / r.height * meta.h };
        },
        on: function (target, type, fn, opts) {
          target.addEventListener(type, fn, opts);
          s.cleanups.push(function () { target.removeEventListener(type, fn, opts); });
        },
        after: function (fn, ms) {
          var id = setTimeout(function () { if (s.running) fn(); }, ms);
          s.cleanups.push(function () { clearTimeout(id); });
          return id;
        },
        every: function (fn, ms) {
          var id = setInterval(function () { if (s.running) fn(); }, ms);
          s.cleanups.push(function () { clearInterval(id); });
          return id;
        },
        loop: function (fn) {
          var last = performance.now(), id = 0;
          function frame(t) {
            if (!s.running) return;
            var dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000));
            last = t;
            if (g) g.setTransform(S, 0, 0, S, 0, 0);
            fn(dt, t);
            id = requestAnimationFrame(frame);
          }
          id = requestAnimationFrame(frame);
          s.cleanups.push(function () { cancelAnimationFrame(id); });
        },
        gameOver: function (score, msg) {
          if (s.over || session !== s) return;
          s.over = true;
          score = Math.floor(score || 0);
          s.running = false;
          s.cleanups.forEach(function (fn) { try { fn(); } catch (e) {} });
          s.cleanups = [];
          var isNew = SP.setBest(meta.id, score);
          bsEl.textContent = SP.fmt(SP.getBest(meta.id));
          scEl.textContent = SP.fmt(score);
          if (isNew) SP.sfx.win(); else SP.sfx.lose();
          setTimeout(function () { if (session === s) showOver(score, msg, isNew); }, 650);
        }
      };

      try {
        s.api = SP.games[meta.id](ctx) || null;
      } catch (err) {
        console.error(err);
        stop();
        showError('เกิดข้อผิดพลาดตอนเริ่มเกม ลองรีเฟรชหน้าเว็บอีกครั้ง');
      }
    }

    /* ---------- ปุ่มควบคุม ---------- */
    bar.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      if (act === 'restart') { start(); }
      else if (act === 'mute') { SP.setMuted(!SP.isMuted()); refreshMute(); }
      else if (act === 'full') {
        if (isFull()) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          var rq = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
          if (rq) { try { rq.call(wrap); } catch (er) {} }
        }
      }
    });

    /* ---------- โหลดสคริปต์เกม แล้วโชว์หน้าแนะนำ ---------- */
    function ready() { if (!destroyed) showIntro(); }
    if (SP.games[meta.id]) {
      ready();
    } else {
      ov.className = 'overlay';
      ov.innerHTML = '<div class="ov-icon">' + meta.icon + '</div><h2>กำลังโหลด...</h2>';
      loadScript('games/' + meta.id + '.js', function () {
        if (SP.games[meta.id]) ready(); else showError('ไม่พบไฟล์เกม');
      }, function () { showError('ไม่พบไฟล์เกม'); });
    }

    return {
      destroy: function () {
        destroyed = true;
        stop();
        window.removeEventListener('resize', onResize);
        document.removeEventListener('fullscreenchange', onResize);
        document.removeEventListener('webkitfullscreenchange', onResize);
        window.removeEventListener('keydown', onKeyBlock);
        if (isFull()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
      }
    };
  };
})();

;
/* =========================================================
   หน้าเว็บหลัก: หน้าแรก หมวดหมู่ ค้นหา และหน้าเล่นเกม (ใช้ #/ เป็นเส้นทาง)
   ========================================================= */
(function () {
  'use strict';
  var SP = window.SP;
  var app = document.getElementById('app');
  var catbar = document.getElementById('catbar');
  var qInput = document.getElementById('q');
  var player = null;

  var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function thumb(g) {
    return '<div class="thumb" style="--c1:' + g.grad[0] + ';--c2:' + g.grad[1] + '">' +
      (g.badge ? '<span class="badge">' + esc(g.badge) + '</span>' : (g.cat === 'thai' ? '<span class="badge thai">🇹🇭 ไทย</span>' : '')) +
      '<span class="em">' + g.icon + '</span>' +
      '<span class="play-hint">' + PLAY_SVG + '</span></div>';
  }

  function card(g) {
    var best = SP.getBest(g.id);
    var cat = SP.getCat(g.cat);
    return '<a class="card" href="#g-' + g.id + '">' + thumb(g) +
      '<div class="card-body"><div class="card-title">' + esc(g.title) + '</div>' +
      '<div class="card-meta"><span>' + (best ? '<span class="best">🏆 ' + SP.fmt(best) + '</span>' : esc(cat ? cat.name : '')) + '</span>' +
      '<span>' + SP.inputLabel(g) + '</span></div></div></a>';
  }

  function byCat(id) { return SP.gameList.filter(function (g) { return g.cat === id; }); }

  function section(title, sub, games, opts) {
    opts = opts || {};
    return '<section class="sec' + (opts.special ? ' special' : '') + '">' +
      '<div class="sec-head"><h2>' + title + (sub ? ' <span class="sub">' + sub + '</span>' : '') + '</h2>' +
      (opts.more ? '<a class="more" href="' + opts.more + '">ดูทั้งหมด →</a>' : '') + '</div>' +
      '<div class="grid">' + games.map(card).join('') + '</div></section>';
  }

  /* ---------- แถบหมวดหมู่ ---------- */
  function renderCatbar(active) {
    catbar.innerHTML = SP.categories.map(function (c) {
      var n = c.id === 'all' ? SP.gameList.length : byCat(c.id).length;
      return '<a class="chip' + (c.special ? ' special' : '') + (c.id === active ? ' on' : '') + '" href="' +
        (c.id === 'all' ? '#' : '#c-' + c.id) + '">' + c.icon + ' ' + esc(c.name) + ' <span class="n">' + n + '</span></a>';
    }).join('');
    var on = catbar.querySelector('.on');
    if (on && on.scrollIntoView) { try { on.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} }
  }

  /* ---------- หน้าแรก ---------- */
  function homeView() {
    var thai = byCat('thai');
    var html = '';
    html += '<section class="hero"><div>' +
      '<span class="kicker">🪷 หมวดพิเศษ</span>' +
      '<h1>เล่นเกม<em>ประเพณีไทย</em><br>สนุกได้ ได้รู้จักวัฒนธรรม</h1>' +
      '<p>ลอยกระทง สงกรานต์ ตะกร้อ ว่าวจุฬา ระนาดเอก และของดีเมืองไทย ถูกแปลงเป็นเกมสนุก ๆ ให้เล่นฟรีทั้งบนมือถือและคอมพิวเตอร์</p>' +
      '<a class="btn" href="#c-thai">▶ เข้าไปเล่นเลย</a></div>' +
      '<div class="hero-games">' + thai.slice(0, 3).map(card).join('') + '</div></section>';

    var recent = SP.getRecent().map(SP.getGame).filter(Boolean);
    if (recent.length) html += section('🕘 เล่นล่าสุด', '', recent.slice(0, 6));

    html += section('🪷 เกมประเพณีไทย', 'เกมพิเศษที่คิดขึ้นจากประเพณีไทย', thai, { special: true, more: '#c-thai' });
    SP.categories.forEach(function (c) {
      if (c.id === 'all' || c.id === 'thai') return;
      var list = byCat(c.id);
      if (list.length) html += section(c.icon + ' ' + esc(c.name), '', list, { more: '#c-' + c.id });
    });
    app.innerHTML = html;
  }

  function catView(id) {
    var c = SP.getCat(id);
    if (!c) { homeView(); return; }
    var list = byCat(id);
    app.innerHTML =
      '<div class="cat-banner"><div class="big">' + c.icon + '</div><div><h1>' + esc(c.name) +
      '</h1><p>' + esc(c.desc || '') + '</p></div></div>' +
      '<section class="sec"><div class="grid">' + list.map(card).join('') + '</div></section>';
  }

  function searchView(q) {
    var key = q.trim().toLowerCase();
    var list = SP.gameList.filter(function (g) {
      var cat = SP.getCat(g.cat);
      return (g.title + ' ' + g.desc + ' ' + (cat ? cat.name : '')).toLowerCase().indexOf(key) !== -1;
    });
    app.innerHTML = '<section class="sec"><div class="sec-head"><h2>ผลการค้นหา “' + esc(q) + '” <span class="sub">' + list.length + ' เกม</span></h2></div>' +
      (list.length ? '<div class="grid">' + list.map(card).join('') + '</div>' :
        '<div class="empty">😢 ไม่พบเกมที่ค้นหา ลองคำอื่นดูนะ<br><br><a class="btn" href="#">ดูเกมทั้งหมด</a></div>') + '</section>';
  }

  /* ---------- หน้าเล่นเกม ---------- */
  function gameView(id) {
    var g = SP.getGame(id);
    if (!g) { location.hash = '#'; return; }
    var cat = SP.getCat(g.cat);
    document.title = g.title + ' — สนุกเพลย์';

    var others = SP.gameList.filter(function (x) { return x.id !== g.id; });
    others.sort(function (a, b) { return (b.cat === g.cat) - (a.cat === g.cat); });
    var side = others.slice(0, 7).map(function (x) {
      var c = SP.getCat(x.cat);
      return '<a class="mini" href="#g-' + x.id + '">' + thumb(x).replace(/<span class="badge[^>]*>.*?<\/span>/, '') +
        '<div><b>' + esc(x.title) + '</b><small>' + esc(c ? c.name : '') + '</small></div></a>';
    }).join('');

    app.innerHTML =
      '<div class="crumbs"><a href="#">หน้าแรก</a> › <a href="#c-' + g.cat + '">' + esc(cat ? cat.name : '') + '</a> › ' + esc(g.title) + '</div>' +
      '<div class="play-layout"><div class="play-main">' +
      '<div id="stageMount"></div>' +
      '<div class="info"><h1>' + g.icon + ' ' + esc(g.title) + '</h1>' +
      '<div class="tags"><span class="tag y">' + esc(cat ? cat.icon + ' ' + cat.name : '') + '</span>' +
      '<span class="tag">เล่นด้วย ' + SP.inputLabel(g) + '</span><span class="tag">ฟรี</span></div>' +
      '<p>' + esc(g.desc) + '</p>' +
      '<h3>วิธีเล่น</h3><ul>' + g.how.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ul>' +
      (g.fact ? '<div class="fact"><b>💡 รู้หรือไม่?</b> ' + esc(g.fact) + '</div>' : '') +
      '</div></div>' +
      '<aside class="side"><h3>เกมอื่น ๆ ที่น่าสนใจ</h3>' + side + '</aside></div>';

    player = SP.mountPlayer(document.getElementById('stageMount'), g, {
      onHome: function () { location.hash = '#'; }
    });
  }

  /* ---------- เส้นทาง ---------- */
  function route() {
    if (player) { player.destroy(); player = null; }
    var h = location.hash.replace(/^#\/?/, '').replace(/^(g|c|search)-/, '$1/');
    var parts = h.split('/');
    document.title = 'สนุกเพลย์ — เล่นเกมออนไลน์ฟรี พร้อมเกมประเพณีไทย';

    if (parts[0] === 'g' && parts[1]) {
      renderCatbar((SP.getGame(parts[1]) || {}).cat);
      gameView(parts[1]);
    } else if (parts[0] === 'search') {
      renderCatbar('');
      searchView(decodeURIComponent(parts.slice(1).join('/')));
    } else if (parts[0] === 'c' && parts[1]) {
      qInput.value = '';
      renderCatbar(parts[1]);
      catView(parts[1]);
      document.title = ((SP.getCat(parts[1]) || {}).name || 'หมวดหมู่') + ' — สนุกเพลย์';
    } else {
      qInput.value = '';
      renderCatbar('all');
      homeView();
    }
    window.scrollTo(0, 0);
  }

  var t = 0;
  qInput.addEventListener('input', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var q = qInput.value.trim();
      if (q) location.hash = '#search-' + encodeURIComponent(q);
      else location.hash = '#';
    }, 250);
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
